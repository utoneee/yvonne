<!doctype html>
<!-- 告訴瀏覽器：這是一份標準的 HTML 網頁 -->
<html lang="zh-Hant">
<!-- 這個網頁的語言是繁體中文 -->
<head>
  <meta charset="utf-8">
  <!-- 使用 utf-8 編碼，中文字才不會變成亂碼 -->

  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <!-- 用手機的寬度顯示，並且禁止兩指縮放 -->

  <title>看圖選字（第一關）</title>
  <!-- 瀏覽器分頁上的標題 -->

  <script src="game-data.js"></script>
  <!-- 載入共用的字表和進度紀錄 -->

  <style>
    html, body {
      margin: 0;
      /* 拿掉預設外邊距 */
      padding: 0;
      /* 拿掉預設內邊距 */
    }

    body {
      font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      /* 一般文字用的繁體中文字型 */
      text-align: center;
      /* 全部置中 */
      -webkit-user-select: none;
      /* （Safari）長按不要選取文字 */
      user-select: none;
      /* （其他瀏覽器）長按不要選取文字 */
      -webkit-touch-callout: none;
      /* iPhone 長按不要跳出選單 */
    }

    #progress {
      /* 最上面的「第幾題 / 共幾題」 */
    }

    #pictureCard {
      /* 放圖片的白色卡片：左邊是圖，右邊是直式注音 */
      width: 260px;
      /* 寬 */
      height: 150px;
      /* 高（固定，換題時畫面才不會跳） */
      margin: 0 auto;
      /* 水平置中 */
      display: flex;
      /* 讓圖片和注音左右並排 */
      align-items: center;
      /* 上下置中 */
      justify-content: center;
      /* 左右置中 */
      gap: 14px;
      /* 圖片和注音之間的距離 */
    }

    #picture {
      /* 圖片（emoji） */
      font-size: 96px;
      /* emoji 是文字，所以用字的大小控制圖片大小 */
      line-height: 1.2;
      /* 行高 */
      height: 120px;
      /* 固定高度，換題時畫面才不會跳 */
      display: flex;
      /* 用 flex 讓 emoji 上下、左右置中 */
      align-items: flex-end;
      /* 貼著底部對齊（大象和老鼠才會站在同一條地平線上） */
      justify-content: center;
      /* 左右置中 */
    }

    #zhuyin {
      /* 圖片右邊的直式注音 */
      display: flex;
      /* 讓「注音符號那一直排」和「聲調」左右並排 */
      align-items: flex-end;
      /* 聲調要對齊最後一個符號，所以往下對齊 */
      font-size: 30px;
      /* 注音大小 */
      line-height: 1.1;
      /* 每個符號的高度 */
      color: #087f5b;
      /* 深綠色 */
    }

    .zhuyin-column {
      /* 注音符號由上往下排成一直排 */
      display: flex;
      /* 用 flex 排列 */
      flex-direction: column;
      /* column = 由上往下排 */
      align-items: center;
      /* 每個符號置中 */
    }

    .zhuyin-light {
      /* 輕聲的「˙」：放在第一個符號的上面，小一點 */
      font-size: 30px;
      /* 「˙」本身很小，所以字的大小跟注音一樣 */
      font-weight: bold;
      /* 加粗，比較看得清楚 */
      line-height: 0.8;
      /* 不要佔太多高度 */
    }

    .zhuyin-tone {
      /* 二、三、四聲的符號：放在最後一個符號的右邊 */
      font-size: 30px;
      /* 聲調符號本身很小，所以字的大小跟注音一樣 */
      font-weight: bold;
      /* 加粗，比較看得清楚 */
      height: 33px;
      /* 跟一個注音符號一樣高（30px × 1.1），才會對齊最後一個符號 */
      line-height: 1;
      /* 聲調靠上一點，在最後一個符號的右上方 */
      width: 16px;
      /* 固定寬度，有沒有聲調，注音都在同一個位置 */
    }

    #question {
      /* 「這是哪一個字？」 */
      font-size: 24px;
      /* 字的大小 */
      margin: 16px 0 12px 0;
      /* 上下空間 */
    }

    #choices {
      /* 放三個選項按鈕的區域 */
      display: flex;
      /* 讓按鈕左右並排 */
      justify-content: center;
      /* 置中 */
      gap: 14px;
      /* 按鈕之間的距離 */
      padding: 0 16px;
      /* 左右留 16px，按鈕才不會貼著螢幕邊緣 */
    }

    .choice-button {
      /* 每一個選項按鈕 */
      width: 104px;
      /* 寬 104px，小手指很好按 */
      height: 104px;
      /* 高 104px */
      font-size: 68px;
      /* 字很大 */
      font-family: "BiauKai", "Kaiti TC", "STKaiti", "TW-Kai", "DFKai-SB", "標楷體", serif;
      /* 選項的字用楷書（跟課本一樣），裝置沒有楷書時就用一般的明體 */
      background: white;
      /* 白底 */
      color: #333333;
      /* 深灰字 */
      padding: 0;
      /* 拿掉按鈕預設的內邊距，字才會在正中間 */
    }

    .choice-button.wrong {
      /* 選錯的按鈕 */
      background: #e9ecef;
      /* 變成灰底 */
      color: #adb5bd;
      /* 字變淡 */
      border-color: #868e96;
      /* 邊框變灰 */
      animation: shake 0.4s;
      /* 左右搖一搖（動畫定義在下面） */
    }

    .choice-button.right {
      /* 選對的按鈕 */
      background: #40c057;
      /* 綠底 */
      color: white;
      /* 白字 */
    }

    .choice-button.reveal {
      /* 沒過關時，揭曉的正確答案：綠色粗框、淡綠底 */
      border-color: #2f9e44;
      background: #ebfbee;
      color: #2b8a3e;
    }

    @keyframes shake {
      /* 「搖一搖」動畫：往左、往右、回到原位 */
      0%   { transform: translateX(0); }
      25%  { transform: translateX(-8px); }
      50%  { transform: translateX(8px); }
      75%  { transform: translateX(-8px); }
      100% { transform: translateX(0); }
    }

    #message {
      /* 答對、答錯的提示文字（外框是 pixel-panel 點陣對話框） */
      padding: 6px 10px;
      /* 框裡面留一點空間 */
      font-size: 26px;
      /* 字的大小 */
      min-height: 76px;
      /* 先保留高度，畫面才不會跳 */
      margin: 14px 16px 6px 16px;
      /* 上下左右的空間 */
      line-height: 1.4;
      /* 行距 */
    }

    #message:empty {
      display: none;
      /* 還沒有文字的時候（:empty = 裡面是空的），先不顯示也不佔位置，題目才會集中在畫面中間 */
    }

    #nextButton {
      /* 「下一題」按鈕 */
      color: white;
      /* 白字 */
      min-width: 220px;
      /* 夠寬 */
      min-height: 68px;
      /* 夠高 */
      font-size: 26px;
      /* 文字大小 */
      background: #339af0;
      /* 藍色 */
      display: none;
      /* 一開始先藏起來（不佔位置），答對才出現 */
    }

  </style>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bpmf+Huninn&display=swap">
  <!-- 從 Google Fonts 載入「注音粉圓」字型（每個字旁邊有注音） -->
  <link rel="stylesheet" href="game-style.css">
  <!-- 共用樣式：注音字型、圖示按鈕、星星動畫 -->
</head>

<body class="level-page">
  <!-- level-page 在 game-style.css：點陣風格、內容放在畫面正中間 -->
  <main class="level-panel">
  <!-- 題目區：半透明白底，後面看得到湖邊風景 -->
  <div id="progress" class="pixel-sign">第 1 題 / 共 5 題</div>
  <!-- 進度 -->

  <div id="pictureCard" class="pixel-panel">
    <!-- 圖片卡片 -->
    <div id="picture"></div>
    <!-- 圖片（emoji）會放在這裡 -->
    <div id="zhuyin"></div>
    <!-- 直式注音會放在圖片右邊 -->
  </div>

  <div id="question">這是哪一個字？</div>
  <!-- 題目 -->

  <div id="choices"></div>
  <!-- 三個選項按鈕（由 JavaScript 自動產生） -->

  <div id="message"></div>
  <!-- 提示文字 -->

  <button id="nextButton" class="pixel-button">下一題 ➜</button>
  <!-- 下一題按鈕 -->

  </main>

  <script>
    // ==========================================================
    // 第一關（看圖選字）的程式
    // 流程：看圖 → 從 3 個字裡選一個 → 選錯可以再選 → 選對拿星星 → 下一題
    // ==========================================================


    // ---------- 1. 題目資料（想加字就照這個格式加一行） ----------

    const QUESTIONS = WORDS;
    // 題目資料來自 game-data.js 的 WORDS（想加字，請改 game-data.js）

    const FISH_CHARACTER = getCharacterFromUrl();
    // 從釣魚畫面過來時，網址會帶著要練習的字（例如 level1.html?char=山）
    // 直接打開這個檔案時是 null，會進入「一輪 5 題」的測試模式

    const CHOICE_COUNT = 3;
    // 每一題有幾個選項

    const MAX_WRONG = 2;
    // 錯幾次就不能過關（3 個選項錯 2 次，剩下的一定是對的，那就是用猜的）


    // ---------- 2. 找出網頁上的元素 ----------

    const progressBox = document.getElementById('progress');
    // 進度文字
    const pictureBox = document.getElementById('picture');
    // 圖片
    const zhuyinBox = document.getElementById('zhuyin');
    // 注音
    const choicesBox = document.getElementById('choices');
    // 選項按鈕區
    const messageBox = document.getElementById('message');
    // 提示文字
    const nextButton = document.getElementById('nextButton');
    // 下一題按鈕


    // ---------- 3. 會變動的資料 ----------

    let questionOrder = [];
    // 這一輪的出題順序（把 QUESTIONS 洗牌後放這裡）
    let questionIndex = 0;
    // 現在是第幾題（從 0 開始算）
    let tries = 0;
    // 這一題已經選了幾次
    let answered = false;
    // 這一題答對了沒（答對後就不能再按選項）
    let totalStars = 0;
    // 這一輪總共拿到幾顆星


    // ---------- 4. 小工具：洗牌 ----------

    function shuffle(list) {
      // 把清單的順序打亂，回傳一個新的清單（原本的清單不會被改到）
      const result = list.slice();
      // 先複製一份
      for (let i = result.length - 1; i > 0; i--) {
        // 從最後一個開始，往前一個一個處理
        const j = Math.floor(Math.random() * (i + 1));
        // 隨機挑一個位置 j（0 到 i 之間）
        const temp = result[i];
        // 先把第 i 個暫存起來
        result[i] = result[j];
        // 第 j 個放到第 i 個的位置
        result[j] = temp;
        // 暫存的放到第 j 個的位置（兩個交換完成）
      }
      return result;
      // 回傳洗好的清單
    }


    // ---------- 4-2. 小工具：把注音排成直式 ----------

    function makeVerticalZhuyin(text) {
      // 例如輸入「ㄎㄡˇ」，做出：
      //   ㄎ
      //   ㄡˇ    ← 聲調在最後一個符號的右邊
      // 輕聲「˙」（例如「˙ㄉㄜ」）則放在最上面
      let tone = '';
      // 二、三、四聲的符號（一聲沒有符號）
      let light = '';
      // 輕聲的「˙」
      let columnHtml = '';
      // 直排的注音符號
      for (let i = 0; i < text.length; i++) {
        // 一個字一個字看
        const symbol = text[i];
        if (symbol === 'ˊ' || symbol === 'ˇ' || symbol === 'ˋ') {
          tone = symbol;
          // 是聲調，先記起來，等一下放右邊
        } else if (symbol === '˙') {
          light = symbol;
          // 是輕聲，等一下放最上面
        } else {
          columnHtml = columnHtml + '<span>' + symbol + '</span>';
          // 是注音符號，加到直排裡（每個 span 會自動排成一列）
        }
      }
      if (light !== '') {
        columnHtml = '<span class="zhuyin-light">' + light + '</span>' + columnHtml;
        // 有輕聲的話，放在直排的最前面（也就是最上面）
      }
      return '<div class="zhuyin-column">' + columnHtml + '</div>'
        + '<div class="zhuyin-tone">' + tone + '</div>';
      // 左邊是直排的符號，右邊是聲調
    }


    // ---------- 5. 出題 ----------

    function showQuestion() {
      const item = questionOrder[questionIndex];
      // 這一題的資料
      tries = 0;
      // 重新計算選了幾次
      answered = false;
      // 還沒答對

      progressBox.textContent = '第 ' + (questionIndex + 1) + ' 題 / 共 ' + questionOrder.length + ' 題';
      if (FISH_CHARACTER !== null) {
        progressBox.textContent = '🐟 ' + LEVEL_NAMES[1];
        // 從釣魚過來的只有一題，改成顯示關卡名稱
      }
      // 更新進度
      pictureBox.innerHTML = item.picture;
      // 顯示圖片（用 innerHTML，因為「大」的圖片裡有 HTML）
      zhuyinBox.innerHTML = makeVerticalZhuyin(item.zhuyin);
      // 把注音（例如「ㄎㄡˇ」）變成直式的 HTML 再放進去
      // 顯示注音
      messageBox.textContent = '';
      // 清空提示
      nextButton.style.display = 'none';
      // 藏起「下一題」按鈕

      const choices = makeChoices(item.character);
      // 做出 3 個選項（1 個正確答案 + 2 個錯的）
      choicesBox.innerHTML = '';
      // 清掉上一題的按鈕
      for (let i = 0; i < choices.length; i++) {
        const button = document.createElement('button');
        // 做一個新按鈕
        button.className = 'choice-button pixel-button';
        // 兩個 class：choice-button（這一頁的樣子）、pixel-button（共用的點陣按鈕）
        // 套用 .choice-button 的樣子
        button.textContent = choices[i];
        // 按鈕上顯示這個字
        button.addEventListener('click', function () {
          checkChoice(button, item);
          // 按下時，檢查選得對不對
        });
        choicesBox.appendChild(button);
        // 放進畫面
      }
    }

    function makeChoices(answer) {
      // 做出選項：正確答案 + 從其他字裡隨機挑的錯誤答案，最後再打亂順序
      const others = [];
      // 用來放「其他的字」
      for (let i = 0; i < QUESTIONS.length; i++) {
        if (QUESTIONS[i].character !== answer) {
          others.push(QUESTIONS[i].character);
          // 不是正確答案的字，都放進來
        }
      }
      const wrongChoices = shuffle(others).slice(0, CHOICE_COUNT - 1);
      // 把其他的字洗牌，取前 2 個當錯誤選項
      wrongChoices.push(answer);
      // 加上正確答案
      return shuffle(wrongChoices);
      // 再洗一次牌，正確答案才不會永遠在最後面
    }


    // ---------- 6. 小朋友按下選項 ----------

    function checkChoice(button, item) {
      if (answered || button.classList.contains('wrong')) {
        return;
        // 這一題已經結束了，或按的是已經選錯變灰的按鈕，就不理它
      }
      tries = tries + 1;
      // 選了幾次 +1

      if (button.textContent !== item.character) {
        // 選錯了
        button.classList.add('wrong');
        // 按鈕變灰、搖一搖
        if (tries >= MAX_WRONG) {
          // 連續錯 MAX_WRONG 次：這一題沒有過關
          // （只有 3 個選項，錯 2 次之後剩下的那個一定是對的，那就變成用「刪去法」猜，不算認得這個字）
          revealAnswer(item);
          // 把正確答案標出來，讓孩子知道是哪一個
          finishQuestion(item, 0);
          // 0 顆星：沒過關
          return;
        }
        messageBox.textContent = '再想想看喔！🤔';
        return;
        // 讓小朋友再選一次
      }

      // 選對了
      button.classList.add('right');
      // 按鈕變綠色
      let stars = 2;
      // 第二次才選對：2 顆星
      if (tries === 1) {
        stars = 3;
        // 第一次就選對：3 顆星
      }
      finishQuestion(item, stars);
    }

    function revealAnswer(item) {
      // 沒過關時，把正確答案的按鈕標成綠框
      const buttons = choicesBox.children;
      for (let i = 0; i < buttons.length; i++) {
        if (buttons[i].textContent === item.character) {
          buttons[i].classList.add('reveal');
          // 加上 reveal（揭曉）的樣子
        }
      }
    }

    function finishQuestion(item, stars) {
      // 這一題結束：顯示星星、記錄結果、出現「下一題」或「回去釣魚」按鈕
      answered = true;
      // 標記這一題結束，選項不能再按
      totalStars = totalStars + stars;
      // 加到總星數

      let detail = '「' + item.character + '」';
      // 星星下面的說明：再說一次這個字（「答對了」不用寫，星星旁邊已經有「太棒了」之類的評語）
      if (stars === 0) {
        detail = '答案是「' + item.character + '」';
        // 沒過關：告訴孩子正確答案
      }

      if (FISH_CHARACTER !== null) {
        // 從釣魚過來的：記錄結果，告訴小朋友魚有沒有長大，然後回去釣魚
        const result = recordResult(item.character, 1, stars);
        // 記錄「這個字在第一關拿到幾顆星」（game-data.js 會決定魚要不要長大；0 顆星不會長大）
        if (stars > 0) {
          detail = detail + '<br>' + growMessage(item.character, result);
          // 過關：加上「長大了！」之類的話
        } else {
          detail = detail + '<br>下次釣到再挑戰吧！';
          // 沒過關：魚不會長大，下次釣到這條魚會再出這一題
        }
        nextButton.textContent = '回去釣魚 🎣';
        nextButton.style.background = '#20c997';
        // 湖水綠，跟其他關卡的「回去」按鈕同一個顏色
      } else if (questionIndex === questionOrder.length - 1) {
        nextButton.textContent = '看看成績 🎉';
        // 最後一題：按鈕改成「看看成績」
      } else {
        nextButton.textContent = '下一題 ➜';
        // 其他題：「下一題」
      }
      showStars(messageBox, stars, detail);
      // 播放星星動畫：空的星星框 → 星星一顆一顆亮起來 → 評語和說明（showStars 在 game-data.js 裡）
      nextButton.style.display = 'inline-block';
      // 顯示按鈕
    }


    // ---------- 7. 下一題、結束、重新開始 ----------

    function goNext() {
      if (FISH_CHARACTER !== null) {
        backToFishing();
        // 從釣魚過來的：答完就回去釣魚
        return;
      }
      if (questionIndex === questionOrder.length - 1) {
        showResult();
        // 已經是最後一題 → 顯示成績
        return;
      }
      if (questionIndex >= questionOrder.length) {
        startRound();
        // 成績畫面時按下按鈕 → 重新開始一輪
        return;
      }
      questionIndex = questionIndex + 1;
      // 換到下一題
      showQuestion();
    }

    function showResult() {
      questionIndex = questionOrder.length;
      // 把題號設成「超過最後一題」，代表現在是成績畫面
      const maxStars = questionOrder.length * 3;
      // 最多可以拿幾顆星
      progressBox.textContent = '全部完成！';
      pictureBox.innerHTML = '🎣';
      // 成績畫面的圖片：釣竿
      zhuyinBox.innerHTML = '';
      // 不用注音
      choicesBox.innerHTML = '';
      // 拿掉選項按鈕
      messageBox.innerHTML = '你一共拿到<br>⭐ ' + totalStars + ' / ' + maxStars + ' 顆星';
      // 顯示總星數
      nextButton.textContent = '再玩一次 🔁';
      nextButton.style.display = 'inline-block';
    }

    function startRound() {
      questionOrder = shuffle(QUESTIONS);
      // 題目洗牌，每一輪的順序都不一樣
      if (FISH_CHARACTER !== null && getWord(FISH_CHARACTER) !== null) {
        questionOrder = [getWord(FISH_CHARACTER)];
        // 從釣魚過來的：只出這條魚身上的那個字
      }
      questionIndex = 0;
      // 從第一題開始
      totalStars = 0;
      // 星星歸零
      showQuestion();
      // 出第一題
    }


    // ---------- 8. 網頁打開時 ----------

    nextButton.addEventListener('click', goNext);
    // 按「下一題」→ 執行 goNext
    startRound();
    // 開始第一輪
  </script>
  <script src="scene-background.js"></script>
  <!-- 在最底層畫出跟釣魚畫面一樣的湖邊風景 -->
</body>
</html>
