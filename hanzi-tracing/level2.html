<!doctype html>
<!-- 上面這行告訴瀏覽器：這是一份標準的 HTML 網頁 -->
<html lang="zh-Hant">
<!-- lang="zh-Hant" 表示這個網頁的語言是「繁體中文」 -->
<head>
  <!-- head 裡面放的是「網頁的設定」，不會直接顯示在畫面上 -->

  <meta charset="utf-8">
  <!-- 使用 utf-8 編碼，中文字才不會變成亂碼 -->

  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <!-- 讓網頁在手機上用「手機的寬度」顯示，並且禁止用兩指放大縮小（避免小朋友寫字時不小心縮放） -->

  <title>描紅（第二關）</title>
  <!-- 瀏覽器分頁上顯示的標題 -->

  <script src="game-data.js"></script>
  <!-- 載入共用的字表和進度紀錄 -->

  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.7.3/dist/hanzi-writer.min.js"></script>
  <!-- 從網路上載入開源工具 Hanzi Writer（3.7.3 版）。它會幫我們畫出字形、播放筆順動畫，並提供每一筆的資料 -->

  <style>
    /* style 裡面放的是 CSS，用來決定畫面「長什麼樣子」 */

    html, body {
      /* 同時設定整個網頁（html）和內容區（body） */
      margin: 0;
      /* 拿掉瀏覽器預設的外邊距 */
      padding: 0;
      /* 拿掉瀏覽器預設的內邊距 */
      overscroll-behavior: none;
      /* 手機上滑到底時，不要出現「彈一下」的效果 */
    }

    body {
      font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      /* 字型：依序嘗試蘋果、微軟、Google 的繁體中文字型 */
      text-align: center;
      /* 文字和按鈕都置中 */
      -webkit-user-select: none;
      /* （Safari 用）不讓手指長按時選取到文字 */
      user-select: none;
      /* （其他瀏覽器用）不讓手指長按時選取到文字 */
      -webkit-touch-callout: none;
      /* iPhone / iPad 長按時不要跳出「拷貝」選單 */
    }

    #charButtons {
      /* 放「山、口、人、日、大」切換按鈕的區域 */
      margin-bottom: 12px;
      /* 跟下面的田字格隔開一點 */
    }

    .char-button {
      /* 每一個「選字按鈕」的樣子 */
      width: 64px;
      /* 寬 64px，小朋友手指按得到 */
      height: 64px;
      /* 高 64px */
      font-size: 36px;
      /* 按鈕上的字很大 */
      margin: 4px;
      /* 按鈕之間留一點空隙，避免按錯 */
      background: white;
      /* 白色底 */
      color: #333333;
      /* 字是深灰色 */
    }

    .back-icon {
      /* 「回去釣魚」按鈕裡的 🎣 */
      display: block;
      font-size: 30px;
      line-height: 1.1;
    }

    .back-text {
      /* 「回去」兩個字：小一點，按鈕才放得下 */
      font-size: 16px;
    }

    .char-button.selected {
      /* 「目前選到的字」的按鈕，換成另一種樣子 */
      background: #f0b429;
      /* 黃色底 */
      color: white;
      /* 白色字 */
    }

    #board {
      /* 田字格的外框（真正的寬高等一下由 JavaScript 依螢幕大小決定） */
      position: relative;
      /* 讓裡面的東西可以用「疊在一起」的方式擺放 */
      margin: 0 auto;
      /* 左右自動留白 = 水平置中 */
      background: white;
      /* 白色的紙 */
      border: 4px solid #e05252;
      /* 紅色的外框，像作業簿的田字格 */
      box-sizing: content-box;
      /* 邊框畫在寬高的「外面」，這樣裡面的大小剛好等於我們設定的大小 */
    }

    .grid-line {
      /* 田字格中間的虛線（共同設定） */
      position: absolute;
      /* 用絕對位置疊在格子上 */
      border-color: #f2a5a5;
      /* 淡紅色 */
      border-style: dashed;
      /* 虛線 */
      border-width: 0;
      /* 先把四邊的線都關掉，下面再各自打開需要的那一邊 */
    }

    .grid-line.horizontal {
      /* 橫的那條虛線 */
      left: 0;
      /* 從最左邊開始 */
      right: 0;
      /* 拉到最右邊 */
      top: 50%;
      /* 放在一半的高度 */
      border-top-width: 2px;
      /* 只顯示上邊的線，粗 2px */
    }

    .grid-line.vertical {
      /* 直的那條虛線 */
      top: 0;
      /* 從最上面開始 */
      bottom: 0;
      /* 拉到最下面 */
      left: 50%;
      /* 放在一半的寬度 */
      border-left-width: 2px;
      /* 只顯示左邊的線，粗 2px */
    }

    #writerArea {
      /* Hanzi Writer 畫淡灰色字的地方 */
      position: absolute;
      /* 疊在田字格上 */
      left: 0;
      /* 對齊左邊 */
      top: 0;
      /* 對齊上面 */
    }

    #countdown {
      /* 倒數 3、2、1：蓋在田字格上，數字在正中間 */
      position: absolute;
      left: 0;
      top: 0;
      right: 0;
      bottom: 0;
      /* 四邊貼齊田字格 = 蓋住整個格子 */
      display: flex;
      align-items: center;
      /* 上下置中 */
      justify-content: center;
      /* 左右置中 */
      background: rgba(255, 255, 255, 0.6);
      /* 半透明的白色，後面淡淡的字還看得到 */
      font-size: 140px;
      /* 數字很大 */
      font-weight: bold;
      color: #f08c00;
      /* 橘色 */
    }

    #countdown.countdown-hidden {
      display: none;
      /* 不倒數的時候藏起來 */
    }

    .countdown-number {
      animation: count-pop 0.6s ease-out both;
      /* 每個數字出現時「彈」一下 */
    }

    @keyframes count-pop {
      from { transform: scale(2); opacity: 0; }
      /* 一開始：很大、透明 */
      to   { transform: scale(1); opacity: 1; }
      /* 最後：正常大小、看得見 */
    }

    #drawCanvas {
      /* 小朋友用手指寫字的「透明畫布」，疊在最上層 */
      position: absolute;
      /* 疊在田字格上 */
      left: 0;
      /* 對齊左邊 */
      top: 0;
      /* 對齊上面 */
      touch-action: none;
      /* 非常重要：在畫布上滑手指時，瀏覽器「不要」捲動或縮放畫面 */
    }

    #message {
      /* 顯示提示、星星、正確率的文字區（外框是 pixel-panel 點陣對話框） */
      padding: 6px 10px;
      /* 框裡面留一點空間 */
      font-size: 26px;
      /* 字大一點，小朋友看得清楚 */
      min-height: 72px;
      /* 先保留固定高度，文字變長時畫面才不會跳動 */
      margin: 10px 16px;
      /* 上下 10px、左右 16px 的空間 */
      line-height: 1.4;
      /* 行距 */
    }

    .tool-row {
      /* 一排按鈕 */
      display: flex;
      /* 讓按鈕左右並排 */
      justify-content: center;
      /* 並排後置中 */
      gap: 12px;
      /* 按鈕之間的距離 */
      margin: 0 16px 12px 16px;
      /* 左右各留 16px，下方留 12px */
    }

    .tool-button {
      /* 下方四個功能按鈕的共同樣子 */
      color: white;
      /* 白色的字（「回去」兩個字） */
      flex: 1;
      /* 同一排的按鈕平分寬度 */
      max-width: 260px;
      /* 平板上不要拉得太寬 */
      min-height: 68px;
      /* 高度至少 68px，小手指很好按 */
      font-size: 24px;
      /* 按鈕文字大小 */
    }

    #undoButton  { background: #f59f00; }
    /* 「擦掉上一筆」：橘色 */
    #clearButton { background: #868e96; }
    /* 「全部重寫」：灰色 */
    #demoButton  { background: #339af0; }
    /* 「示範筆順」：藍色 */
    #checkButton { background: #37b24d; }
    /* 「確定」：綠色 */
  </style>

  <!-- 從 Google Fonts 載入「注音粉圓」字型（每個字旁邊有注音） -->
  <link rel="stylesheet" href="game-style.css">
  <!-- 共用樣式：注音字型、圖示按鈕、星星動畫 -->
</head>

<body class="level-page scene-stream">
  <!-- body 裡面放的是「真正會顯示在畫面上」的東西 -->
  <!-- level-page、scene-stream 在 game-style.css：點陣風格、溪邊的背景 -->

  <div class="pixel-sign">🐟 第二關・描紅</div>
  <!-- 木頭招牌 -->

  <div id="charButtons"></div>
  <!-- 選字按鈕會由 JavaScript 自動放進這裡 -->

  <div id="board" class="grid-shadow">
    <!-- 田字格：裡面有四層，從下到上疊起來 -->
    <div class="grid-line horizontal"></div>
    <!-- 第 1 層：橫虛線 -->
    <div class="grid-line vertical"></div>
    <!-- 第 2 層：直虛線 -->
    <div id="writerArea"></div>
    <!-- 第 3 層：Hanzi Writer 畫的淡灰色字 -->
    <canvas id="drawCanvas"></canvas>
    <!-- 第 4 層：小朋友寫字的透明畫布 -->
    <div id="countdown" class="countdown-hidden"></div>
    <!-- 第 5 層（最上面）：一開始的倒數 3、2、1（平常藏起來） -->
  </div>

  <div id="message" class="pixel-panel">字載入中，請稍等…</div>
  <!-- 提示文字、評分結果會顯示在這裡 -->

  <div class="tool-row">
    <!-- 按鈕用圖示代替文字（小一的孩子看圖就懂）：
         橡皮擦 = 擦掉上一筆、圓形箭頭 = 全部重寫、播放 = 示範筆順、打勾 = 確定
         aria-label 是給「螢幕報讀軟體」念的文字，畫面上看不到 -->
    <button id="undoButton" class="tool-button pixel-button" aria-label="擦掉上一筆"><svg class="icon" viewBox="0 0 48 48" aria-hidden="true"><g transform="rotate(-35 24 24)"><rect x="6" y="15" width="36" height="18" rx="4" fill="#ffc9c9"/><rect x="6" y="15" width="13" height="18" rx="4" fill="#ffffff"/><rect x="6" y="15" width="36" height="18" rx="4" fill="none" stroke="#5c3d2e" stroke-width="3"/></g></svg></button>
    <button id="clearButton" class="tool-button pixel-button" aria-label="全部重寫"><svg class="icon" viewBox="0 0 48 48" aria-hidden="true"><path d="M39 26a15 15 0 1 1-5-11.5" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/><path d="M35 5v10.5H24.5" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button id="demoButton" class="tool-button pixel-button" aria-label="示範筆順"><svg class="icon" viewBox="0 0 48 48" aria-hidden="true"><path d="M17 10l22 14-22 14z" fill="#fff" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg></button>
    <button id="checkButton" class="tool-button pixel-button" aria-label="確定"><svg class="icon" viewBox="0 0 48 48" aria-hidden="true"><path d="M10 25l9 9 19-20" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>

  <script>
    // ==========================================================
    // 這裡開始是 JavaScript：負責「動作」和「判斷」
    // 兩條斜線 // 後面的文字是註解，電腦會忽略，是寫給人看的
    // ==========================================================


    // ---------- 1. 可以自己調整的設定 ----------

    const FISH_CHARACTER = getCharacterFromUrl();
    // 從釣魚畫面過來時，網址會帶著要練習的字（例如 level2.html?char=山）
    // 直接打開這個檔案時是 null，可以用上面的按鈕切換字來測試

    let TEST_CHARACTERS = wordCharacters();
    // 可以切換的字（來自 game-data.js 的字表）
    if (FISH_CHARACTER !== null) {
      TEST_CHARACTERS = [FISH_CHARACTER];
      // 從釣魚過來的：只練這一個字
    }
    // 要練習的字，放在一個「清單」（陣列）裡。想加字就加在這裡

    const START_END_LIMIT = 200;
    // 起點、終點最多可以偏離多遠（單位：字的座標，整個字的寬度是 1024）
    // 200 大約是格子寬度的 1/5。數字越大越寬鬆

    const AVERAGE_LIMIT = 100;
    // 整條線「平均」最多可以偏離標準線多遠。數字越大越寬鬆

    const MIN_LENGTH_RATIO = 0.6;
    // 一筆至少要有標準筆畫 60% 的長度，太短就算錯。越小越寬鬆

    const MIN_STROKE_LENGTH = 30;
    // 比這個還短的線，當作「不小心點到」，直接丟掉不算一筆


    // ---------- 2. 從網頁上找出等一下要用到的元素 ----------

    const board = document.getElementById('board');
    // 田字格外框
    const canvas = document.getElementById('drawCanvas');
    // 寫字用的畫布
    const ctx = canvas.getContext('2d');
    // ctx 是「畫筆」，之後用它在畫布上畫線
    const messageBox = document.getElementById('message');
    // 顯示文字的區域
    const charButtonsBox = document.getElementById('charButtons');
    // 放選字按鈕的區域


    // ---------- 3. 遊戲進行中會變動的資料（變數） ----------

    let currentCharacter = TEST_CHARACTERS[0];
    // 目前在練習哪個字，一開始是清單第一個字「山」

    let characterData = null;
    // 這個字的筆畫資料（從 Hanzi Writer 下載）。null 代表「還沒拿到」

    let writer = null;
    // Hanzi Writer 的「寫字器」，等一下才建立

    let boardSize = 300;
    // 田字格的邊長（像素），等一下會依螢幕大小重新計算

    let padding = 15;
    // 字和格子邊框之間要留多少空白（像素）

    let userStrokes = [];
    // 小朋友寫的所有筆畫。每一筆是一串點，每個點是 {x: 數字, y: 數字}

    let currentStroke = null;
    // 「正在寫」的那一筆。null 代表手指現在沒有在寫

    let activePointerId = null;
    // 正在寫字的那根手指的編號（用來忽略同時碰到螢幕的其他手指或手掌）

    let strokeResults = null;
    // 按下「確定」後，每一筆是對（true）還是錯（false）。null 代表還沒評分

    let isAnimating = false;
    // 是否正在播放筆順動畫（播放時先不給寫）


    // ---------- 4. 決定田字格大小 ----------

    function calculateBoardSize() {
      // 這個「函式」負責算出田字格要多大
      const widthLimit = window.innerWidth - 40;
      // 螢幕寬度扣掉左右留白和邊框
      let heightLimit = window.innerHeight - 450;
      // 螢幕高度扣掉上下其他東西的空間
      if (FISH_CHARACTER !== null) {
        heightLimit = heightLimit + 60;
        // 從釣魚過來的：上面沒有選字按鈕，格子可以大一點
      }
      // 螢幕高度扣掉標題、選字按鈕、功能按鈕的空間
      let size = Math.min(widthLimit, heightLimit, 520);
      // 取三個數字中最小的，最大不超過 520 像素
      if (size < 260) {
        // 如果算出來太小（例如手機橫放）
        size = 260;
        // 至少保持 260 像素，免得格子太小寫不了
      }
      return Math.floor(size);
      // 去掉小數點後回傳
    }

    function applyBoardSize() {
      // 把算好的大小，套用到田字格、畫布和 Hanzi Writer 上
      boardSize = calculateBoardSize();
      // 算出新的邊長
      padding = Math.round(boardSize * 0.05);
      // 留白 = 邊長的 5%

      board.style.width = boardSize + 'px';
      // 設定田字格的寬
      board.style.height = boardSize + 'px';
      // 設定田字格的高

      const ratio = window.devicePixelRatio || 1;
      // 手機螢幕通常「1 個點 = 2~3 個實際像素」，這個數字就是那個倍數
      canvas.style.width = boardSize + 'px';
      // 畫布在畫面上「看起來」的寬
      canvas.style.height = boardSize + 'px';
      // 畫布在畫面上「看起來」的高
      canvas.width = boardSize * ratio;
      // 畫布「實際」的像素寬（乘上倍數，線條才不會糊糊的）
      canvas.height = boardSize * ratio;
      // 畫布「實際」的像素高
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      // 告訴畫筆：之後畫的東西自動放大這個倍數，這樣我們就可以照「看起來的大小」畫

      if (writer !== null) {
        // 如果寫字器已經建立過了（例如手機轉向時）
        writer.updateDimensions({ width: boardSize, height: boardSize, padding: padding });
        // 請 Hanzi Writer 換成新的大小
      }
      redraw();
      // 用新大小把小朋友寫的字重畫一次
    }


    // ---------- 5. 座標換算 ----------
    // 螢幕的座標：左上角是 (0,0)，往右 x 變大，往下 y 變大，單位是像素
    // 字的座標：Hanzi Writer 的資料用的，整個字是 1024 x 1024，而且「往上」y 才變大
    // 我們把小朋友寫的點「換成字的座標」再存起來，這樣才能跟標準筆畫比較

    function screenToChar(screenX, screenY) {
      // 把「螢幕上的點」換成「字的座標」
      const t = HanziWriter.getScalingTransform(boardSize, boardSize, padding);
      // 請 Hanzi Writer 告訴我們它是怎麼縮放的：t.scale 是縮放倍數，t.x、t.y 是位移
      return {
        x: (screenX - t.x) / t.scale,
        // 先扣掉位移，再除以縮放倍數
        y: (boardSize - t.y - screenY) / t.scale
        // y 要上下顛倒，所以用「總高度」去減
      };
    }

    function charToScreen(point) {
      // 反過來：把「字的座標」換回「螢幕上的點」，畫線的時候用
      const t = HanziWriter.getScalingTransform(boardSize, boardSize, padding);
      // 一樣先拿到縮放資訊
      return {
        x: point.x * t.scale + t.x,
        // 乘上縮放倍數，再加回位移
        y: boardSize - t.y - point.y * t.scale
        // y 一樣要上下顛倒回來
      };
    }

    function getPointFromEvent(event) {
      // 從「手指碰觸事件」拿到手指的位置，並換成字的座標
      const rect = canvas.getBoundingClientRect();
      // 取得畫布在螢幕上的位置（左上角在哪裡）
      const screenX = event.clientX - rect.left;
      // 手指的 x 減掉畫布左邊 = 手指在畫布裡的 x
      const screenY = event.clientY - rect.top;
      // 手指的 y 減掉畫布上邊 = 手指在畫布裡的 y
      return screenToChar(screenX, screenY);
      // 換成字的座標後回傳
    }


    // ---------- 6. 在畫布上畫出小朋友寫的線 ----------

    function redraw() {
      // 把畫布清乾淨，再把每一筆重新畫一次
      ctx.clearRect(0, 0, boardSize, boardSize);
      // 清空整個畫布

      for (let i = 0; i < userStrokes.length; i++) {
        // 一筆一筆處理（i 從 0 開始，代表第 1 筆）
        let color = '#222222';
        // 還沒評分時，線是黑色
        if (strokeResults !== null) {
          // 如果已經按過「確定」
          if (strokeResults[i] === true) {
            // 這一筆寫對了
            color = '#2f9e44';
            // 用綠色
          } else {
            // 這一筆寫錯了
            color = '#e03131';
            // 用紅色
          }
        }
        drawOneStroke(userStrokes[i], color);
        // 用決定好的顏色畫出這一筆
      }
    }

    function drawOneStroke(points, color) {
      // 畫出「一筆」：把這一筆的每個點用線連起來
      ctx.strokeStyle = color;
      // 線的顏色
      ctx.lineWidth = boardSize * 0.045;
      // 線的粗細：格子邊長的 4.5%，像粗粗的鉛筆
      ctx.lineCap = 'round';
      // 線的頭尾是圓的
      ctx.lineJoin = 'round';
      // 轉彎的地方也是圓的

      ctx.beginPath();
      // 開始一條新的線
      const first = charToScreen(points[0]);
      // 第一個點換成螢幕座標
      ctx.moveTo(first.x, first.y);
      // 把筆移到第一個點（還沒畫）
      for (let i = 1; i < points.length; i++) {
        // 從第二個點開始
        const p = charToScreen(points[i]);
        // 換成螢幕座標
        ctx.lineTo(p.x, p.y);
        // 從上一個點畫一條線到這個點
      }
      if (points.length === 1) {
        // 如果這一筆只有一個點（手指剛放下去）
        ctx.lineTo(first.x + 0.1, first.y);
        // 畫一條很短的線，讓它看起來像一個圓點
      }
      ctx.stroke();
      // 真正把線畫出來
    }


    // ---------- 7. 接收手指（或滑鼠）的動作 ----------
    // pointer 事件同時支援手指、觸控筆和滑鼠，所以電腦上也能用滑鼠測試

    canvas.addEventListener('pointerdown', function (event) {
      // 手指「放到」畫布上時會執行這裡
      if (isAnimating) {
        // 正在播放筆順動畫
        return;
        // 先不給寫，直接結束
      }
      if (activePointerId !== null) {
        // 已經有一根手指在寫了（可能是手掌碰到螢幕）
        return;
        // 忽略這根新的手指
      }
      event.preventDefault();
      // 阻止瀏覽器原本的動作（例如捲動、選取）
      activePointerId = event.pointerId;
      // 記住是哪根手指在寫
      canvas.setPointerCapture(event.pointerId);
      // 就算手指滑出畫布外，也繼續收到這根手指的動作

      if (strokeResults !== null) {
        // 如果剛剛已經評分過，又開始寫
        strokeResults = null;
        // 把評分結果清掉，線恢復成黑色（寫的時候不顯示對錯）
        showMessage('繼續寫寫看！');
        // 更新提示文字
      }

      setCheckGoesBack(false);
      // 又開始寫了：按鈕變回「確定」
      currentStroke = [getPointFromEvent(event)];
      // 建立新的一筆，裡面先放第一個點
      userStrokes.push(currentStroke);
      // 把這一筆加到「所有筆畫」的清單最後面
      redraw();
      // 重畫畫面
    });

    canvas.addEventListener('pointermove', function (event) {
      // 手指在畫布上「移動」時會一直執行這裡
      if (currentStroke === null || event.pointerId !== activePointerId) {
        // 如果現在沒有在寫，或是動的是別根手指
        return;
        // 不理它
      }
      event.preventDefault();
      // 阻止瀏覽器捲動畫面
      currentStroke.push(getPointFromEvent(event));
      // 把手指目前的位置加到這一筆裡
      redraw();
      // 重畫，讓小朋友看到線跟著手指跑
    });

    function finishStroke(event) {
      // 手指「離開」畫面時要做的事
      if (currentStroke === null || event.pointerId !== activePointerId) {
        // 如果現在沒有在寫，或是離開的是別根手指
        return;
        // 不理它
      }
      if (getStrokeLength(currentStroke) < MIN_STROKE_LENGTH) {
        // 如果這一筆太短（只是點一下）
        userStrokes.pop();
        // 把它從清單最後面拿掉，不算一筆
      }
      currentStroke = null;
      // 這一筆寫完了
      activePointerId = null;
      // 沒有手指在寫了
      redraw();
      // 重畫畫面
    }

    canvas.addEventListener('pointerup', finishStroke);
    // 手指正常離開螢幕時，執行 finishStroke
    canvas.addEventListener('pointercancel', finishStroke);
    // 被系統打斷時（例如跳出通知），也執行 finishStroke

    canvas.addEventListener('touchmove', function (event) {
      // 額外保險：有些舊的 iPhone / iPad 只看 touch 事件
      event.preventDefault();
      // 在畫布上滑動時，阻止畫面上下捲動
    }, { passive: false });
    // passive: false 是告訴瀏覽器「我會阻止捲動」，不加的話 preventDefault 會沒效


    // ---------- 8. 計算用的小工具 ----------

    function distance(a, b) {
      // 算兩個點之間的直線距離（國中學的畢氏定理）
      const dx = a.x - b.x;
      // 橫向差多少
      const dy = a.y - b.y;
      // 直向差多少
      return Math.sqrt(dx * dx + dy * dy);
      // 開根號（dx² + dy²）= 距離
    }

    function getStrokeLength(points) {
      // 算一筆的總長度：把每兩個相鄰點的距離加起來
      let total = 0;
      // 從 0 開始累加
      for (let i = 1; i < points.length; i++) {
        // 從第二個點開始，跟前一個點比
        total = total + distance(points[i - 1], points[i]);
        // 加上這一小段的長度
      }
      return total;
      // 回傳總長度
    }

    function makeDensePoints(median) {
      // Hanzi Writer 給的標準筆畫只有幾個「轉折點」，點跟點之間距離很遠
      // 這個函式在它們之間每隔 10 單位補一個點，變成密密麻麻的點，比較好比對
      const result = [];
      // 用來放結果的空清單
      for (let i = 0; i < median.length - 1; i++) {
        // 處理每一段（第 i 個點到第 i+1 個點）
        const start = { x: median[i][0], y: median[i][1] };
        // 這一段的起點（資料裡的格式是 [x, y]，換成 {x, y}）
        const end = { x: median[i + 1][0], y: median[i + 1][1] };
        // 這一段的終點
        const steps = Math.max(1, Math.ceil(distance(start, end) / 10));
        // 這一段要切成幾份（每份大約 10 單位，至少 1 份）
        for (let s = 0; s < steps; s++) {
          // 一份一份補點
          const t = s / steps;
          // t 是「走到這段的幾分之幾」，從 0 慢慢變大
          result.push({
            x: start.x + (end.x - start.x) * t,
            // 起點往終點方向走 t 那麼多的 x
            y: start.y + (end.y - start.y) * t
            // 起點往終點方向走 t 那麼多的 y
          });
        }
      }
      const last = median[median.length - 1];
      // 最後一個轉折點
      result.push({ x: last[0], y: last[1] });
      // 也加進去，才不會漏掉終點
      return result;
      // 回傳補好的點
    }

    function averageNearestDistance(fromPoints, toPoints) {
      // 對 fromPoints 裡的每個點，找出 toPoints 裡「離它最近」的點有多遠，最後取平均
      // 平均越小，代表兩條線越貼近
      let total = 0;
      // 累加用
      for (let i = 0; i < fromPoints.length; i++) {
        // 每個點都檢查
        let nearest = Infinity;
        // 先假設最近距離是「無限大」
        for (let j = 0; j < toPoints.length; j++) {
          // 跟另一條線的每個點比
          const d = distance(fromPoints[i], toPoints[j]);
          // 算距離
          if (d < nearest) {
            // 如果比目前找到的還近
            nearest = d;
            // 就記下來
          }
        }
        total = total + nearest;
        // 把這個點的最近距離加起來
      }
      return total / fromPoints.length;
      // 除以點的數量 = 平均距離
    }


    // ---------- 9. 判斷「一筆」寫得對不對（整個程式最重要的地方） ----------

    function isStrokeCorrect(userPoints, median) {
      // userPoints：小朋友寫的那一筆
      // median：Hanzi Writer 給的標準筆畫「中心線」
      const standardPoints = makeDensePoints(median);
      // 先把標準線補成密密的點

      const userStart = userPoints[0];
      // 小朋友這一筆的起點
      const userEnd = userPoints[userPoints.length - 1];
      // 小朋友這一筆的終點
      const standardStart = standardPoints[0];
      // 標準筆畫的起點
      const standardEnd = standardPoints[standardPoints.length - 1];
      // 標準筆畫的終點

      // 檢查 1：起點有沒有在正確的位置附近？
      if (distance(userStart, standardStart) > START_END_LIMIT) {
        return false;
        // 離太遠 → 這筆不對（也會抓到「方向寫反」，例如橫線從右寫到左）
      }

      // 檢查 2：終點有沒有在正確的位置附近？
      if (distance(userEnd, standardEnd) > START_END_LIMIT) {
        return false;
        // 離太遠 → 這筆不對
      }

      // 檢查 3：小朋友的線，有沒有一直貼著標準線走？
      if (averageNearestDistance(userPoints, standardPoints) > AVERAGE_LIMIT) {
        return false;
        // 平均偏太多 → 中間歪掉或亂畫
      }

      // 檢查 4：標準線的每個地方，有沒有都被小朋友描到？
      if (averageNearestDistance(standardPoints, userPoints) > AVERAGE_LIMIT) {
        return false;
        // 有一大段沒描到 → 例如「豎折」只畫成一條斜線
      }

      // 檢查 5：長度夠不夠？
      if (getStrokeLength(userPoints) < getStrokeLength(standardPoints) * MIN_LENGTH_RATIO) {
        return false;
        // 寫得太短 → 例如只描了一小段就停了
      }

      return true;
      // 五項都通過 → 這一筆寫對了
    }


    // ---------- 10. 按下「確定」：幫整個字評分 ----------

    function checkAnswer() {
      if (characterData === null) {
        // 字的資料還沒下載好
        showMessage('字還在載入，請稍等一下');
        return;
        // 先不評分
      }
      if (userStrokes.length === 0) {
        // 一筆都還沒寫
        showMessage('先用手指寫寫看喔！');
        return;
        // 先不評分
      }

      const medians = characterData.medians;
      // 這個字所有標準筆畫的中心線，照教科書的筆順排好
      const totalStrokes = medians.length;
      // 這個字總共有幾筆
      let correctCount = 0;
      // 寫對幾筆，從 0 開始算
      strokeResults = [];
      // 準備記錄每一筆的對錯

      for (let i = 0; i < userStrokes.length; i++) {
        // 小朋友寫的每一筆都檢查
        let correct = false;
        // 先假設是錯的
        if (i < totalStrokes) {
          // 如果這個字有「第 i 筆」（寫太多筆的話，多出來的一定是錯的）
          correct = isStrokeCorrect(userStrokes[i], medians[i]);
          // 小朋友的第 i 筆，跟標準的第 i 筆比（所以筆順也要對）
        }
        strokeResults.push(correct);
        // 記下這一筆的結果
        if (correct) {
          // 如果寫對了
          correctCount = correctCount + 1;
          // 寫對的數量加 1
        }
      }

      const percent = correctCount / totalStrokes * 100;
      // 正確率 = 寫對的筆畫數 ÷ 總筆畫數 × 100（變成百分比）
      const percentText = Math.round(percent) + '%';
      // 四捨五入成整數，加上 % 符號，顯示用

      let stars = 0;
      // 星星數，先設 0
      if (percent >= 90) {
        stars = 3;
        // 90% 以上：三顆星
      } else if (percent >= 75) {
        stars = 2;
        // 75～89%：兩顆星
      } else if (percent >= 50) {
        stars = 1;
        // 50～74%：一顆星
      }
      // 都不符合的話，stars 維持 0，代表失敗

      let text = '寫對 ' + correctCount + ' / ' + totalStrokes + ' 筆，正確率 ' + percentText;
      // 星星下面的說明
      if (FISH_CHARACTER !== null) {
        text = text + '<br>' + recordAndDescribe(currentCharacter, 2, stars);
        // 從釣魚過來的：記錄結果，加上「魚有沒有長大」
        setCheckGoesBack(true);
        // 打勾按鈕變成「回去釣魚」
      }
      showStars(messageBox, stars, text);
      // 播放星星動畫：空的星星框 → 星星一顆一顆亮起來 → 評語和說明（showStars 在 game-data.js 裡）
      // 顯示結果
      redraw();
      // 重畫：寫對的筆變綠色、寫錯的變紅色
    }


    // ---------- 11. 其他按鈕的功能 ----------

    // ---------- 打勾按鈕變成「回去釣魚」 ----------
    // 從釣魚過來時，按下「確定」看完星星，打勾按鈕會原地變成 🎣「回去釣魚」
    // 孩子的手指就在那裡，不用到畫面最上面找按鈕；如果又開始寫或擦，會變回打勾

    const checkButton = document.getElementById('checkButton');
    const CHECK_BUTTON_HTML = checkButton.innerHTML;
    // 記下打勾按鈕原本的樣子，等一下要變回來
    let checkGoesBack = false;
    // 現在按下這個按鈕，是「回去釣魚」（true）還是「確定」（false）

    function setCheckGoesBack(goesBack) {
      // 切換打勾按鈕的功能和樣子
      checkGoesBack = goesBack;
      if (goesBack) {
        checkButton.innerHTML = '<span class="back-icon">🎣</span><span class="back-text">回去</span>';
        checkButton.style.background = '#20c997';
        // 湖水綠的「回去釣魚」
      } else {
        checkButton.innerHTML = CHECK_BUTTON_HTML;
        checkButton.style.background = '';
        // 變回原本的綠色打勾（'' 代表用 CSS 裡寫的顏色）
      }
    }

    function onCheckButton() {
      if (checkGoesBack) {
        backToFishing();
        // 現在是「回去釣魚」
      } else {
        checkAnswer();
        // 現在是「確定」
      }
    }


    function undoLastStroke() {
      // 「擦掉上一筆」
      if (isAnimating) {
        return;
        // 動畫播放中先不處理
      }
      setCheckGoesBack(false);
      // 按鈕變回「確定」
      userStrokes.pop();
      // 把清單最後一筆拿掉
      strokeResults = null;
      // 清掉評分結果
      showMessage('擦掉一筆了');
      redraw();
      // 重畫
    }

    function clearAllStrokes() {
      // 「全部重寫」
      if (isAnimating) {
        return;
        // 動畫播放中先不處理
      }
      setCheckGoesBack(false);
      // 按鈕變回「確定」
      userStrokes = [];
      // 清單變成空的
      strokeResults = null;
      // 清掉評分結果
      showMessage('照著灰色的字寫寫看！');
      redraw();
      // 重畫（畫布會變乾淨）
    }

    let countdownTimer = null;
    // 倒數用的計時器（null 代表沒有在倒數）

    function startCountdown() {
      // 倒數 3、2、1，倒數完自動播放一次筆順動畫
      const countdownBox = document.getElementById('countdown');
      let number = 3;
      // 從 3 開始
      isAnimating = true;
      // 倒數的時候先不給寫（寫字、擦掉、重寫都會先檢查 isAnimating）
      showMessage('準備看筆順囉！');
      countdownBox.innerHTML = '<span class="countdown-number">' + number + '</span>';
      countdownBox.classList.remove('countdown-hidden');
      // 顯示「3」
      countdownTimer = setInterval(function () {
        // setInterval：每 0.8 秒執行一次這裡
        number = number - 1;
        if (number === 0) {
          // 倒數完了
          clearInterval(countdownTimer);
          // 停止計時器
          countdownTimer = null;
          countdownBox.classList.add('countdown-hidden');
          // 藏起倒數
          isAnimating = false;
          // 先解除，playDemo 才會播放
          playDemo();
          // 播放筆順動畫（播完會自動顯示「換你寫寫看！」）
          return;
        }
        countdownBox.innerHTML = '<span class="countdown-number">' + number + '</span>';
        // 換成下一個數字（每次放新的 span，「彈一下」的動畫才會重新播放）
      }, 800);
    }

    function stopCountdown() {
      // 倒數到一半就換字時，把倒數停掉
      if (countdownTimer !== null) {
        clearInterval(countdownTimer);
        countdownTimer = null;
      }
      document.getElementById('countdown').classList.add('countdown-hidden');
    }

    function playDemo() {
      // 「示範筆順」
      if (isAnimating || characterData === null) {
        return;
        // 已經在播放，或字還沒載入，就不處理
      }
      isAnimating = true;
      // 標記：正在播放
      canvas.style.visibility = 'hidden';
      // 先把小朋友寫的線藏起來，才看得清楚動畫
      showMessage('看清楚，一筆一筆的順序喔！');
      writer.animateCharacter({
        // 請 Hanzi Writer 播放筆順動畫
        onComplete: function () {
          // 動畫播完後會執行這裡
          writer.hideCharacter();
          // 把動畫畫出來的字藏起來，只留下淡灰色的字
          canvas.style.visibility = 'visible';
          // 把小朋友寫的線顯示回來
          isAnimating = false;
          // 標記：播放結束
          showMessage('換你寫寫看！');
        }
      });
    }

    function showMessage(text) {
      // 在提示區顯示文字（text 裡可以有 <br> 換行）
      messageBox.innerHTML = text;
    }


    // ---------- 12. 切換練習的字 ----------

    function selectCharacter(character) {
      currentCharacter = character;
      // 記住現在練哪個字
      characterData = null;
      // 舊的資料不能用了，等新的下載
      userStrokes = [];
      // 清掉小朋友寫的線
      strokeResults = null;
      // 清掉評分結果
      stopCountdown();
      // 如果正在倒數，先停掉
      isAnimating = false;
      // 如果動畫還在播，直接當作結束
      canvas.style.visibility = 'visible';
      // 確保畫布是看得到的
      redraw();
      // 重畫（變乾淨）
      updateCharButtons();
      // 更新選字按鈕的顏色
      showMessage('字載入中，請稍等…');
      writer.setCharacter(character);
      // 請 Hanzi Writer 換成新的字（它會自動下載資料）
    }

    function updateCharButtons() {
      // 讓目前選到的字按鈕變成黃色
      const buttons = charButtonsBox.children;
      // 拿到所有選字按鈕
      for (let i = 0; i < buttons.length; i++) {
        if (buttons[i].textContent === currentCharacter) {
          // 如果按鈕上的字就是目前的字
          buttons[i].classList.add('selected');
          // 加上「選到了」的樣子
        } else {
          buttons[i].classList.remove('selected');
          // 其他按鈕拿掉「選到了」的樣子
        }
      }
    }

    function createCharButtons() {
      if (FISH_CHARACTER !== null) {
        return;
        // 從釣魚過來的：只練一個字，不用做選字按鈕
        // （回去釣魚：評分後，打勾按鈕會變成「回去」）
      }
      // 依照 TEST_CHARACTERS 清單，自動做出選字按鈕
      for (let i = 0; i < TEST_CHARACTERS.length; i++) {
        const character = TEST_CHARACTERS[i];
        // 取出第 i 個字
        const button = document.createElement('button');
        // 建立一個新的按鈕
        button.textContent = character;
        // 按鈕上顯示這個字

        // 套用 .char-button 的樣子
        button.addEventListener('click', function () {

        });

    }


    // ---------- 13. 網頁打開時，依序做這些準備 ----------

    createCharButtons();
    // 做出選字按鈕
    applyBoardSize();
    // 決定田字格大小

    writer = HanziWriter.create('writerArea', currentCharacter, {
      // 建立 Hanzi Writer 寫字器，畫在 id="writerArea" 的地方
      width: boardSize,

      height: boardSize,

      padding: padding,
      // 字和邊框的距離
      showCharacter: false,
      // 一開始「不要」顯示黑色的字
      showOutline: true,
      // 要顯示「淡灰色的字」讓小朋友描
      outlineColor: '#dddddd',
      // 淡灰色
      strokeColor: '#339af0',
      // 筆順動畫用藍色
      strokeAnimationSpeed: 1,
      // 動畫速度（1 是正常速度）
      delayBetweenStrokes: 400,
      // 每一筆動畫之間停 0.4 秒，比較看得清楚
      onLoadCharDataSuccess: function (data) {
        // 字的資料下載成功時會執行這裡
        characterData = data;
        // 存起來，評分時要用（data.medians 就是每一筆的中心線）
        startCountdown();
        // 倒數 3、2、1，然後自動播放一次筆順
      },
      onLoadCharDataError: function () {
        // 下載失敗時（例如沒有網路）會執行這裡
        showMessage('字載入失敗，請檢查網路後重\u{E01E1}新整理');
        // \u{E01E1}：讓注音字型把「重」念成 ㄔㄨㄥˊ
      }
    });

    updateCharButtons();
    // 讓第一個字的按鈕變黃色

    document.getElementById('undoButton').addEventListener('click', undoLastStroke);
    // 按「擦掉上一筆」→ 執行 undoLastStroke
    document.getElementById('clearButton').addEventListener('click', clearAllStrokes);
    // 按「全部重寫」→ 執行 clearAllStrokes
    document.getElementById('demoButton').addEventListener('click', playDemo);
    // 按「示範筆順」→ 執行 playDemo
    checkButton.addEventListener('click', onCheckButton);
    // 按「確定」→ 執行 checkAnswer

    window.addEventListener('resize', applyBoardSize);
    // 螢幕大小改變時（例如平板轉向），重新調整田字格大小
  </script>
</body>
</html>
