        // O 外框、B 咖啡色毛、C 米色臉和肚子、E 眼睛、P 腮紅、N 鼻子、G 綠圍巾

    // T 葉子、W 樹幹


    // ---------- 3. 找出網頁上的元素 ----------

    // 換角色按鈕

    // 一「格」是幾個像素（依螢幕寬度計算）
    let gameWidth = 72;
    // 整個畫面橫的方向有幾格（依螢幕寬度計算）
    let gameHeight = 160;

    let waterTop = 60;

    // 'hooked'   魚咬鉤了，正在拉
    // 'leaping'  魚被拉出水面，在空中

    let scenery = { trees: [], flowers: [], clouds: [], ripples: [] };

    let lastTime = 0;

    let totalTime = 0;
    // 遊戲開始後經過的總秒數（用來做搖擺、波浪的動畫）


    // ---------- 5. 畫圖的小工具 ----------

    function rect(x, y, w, h, color) {
      // 用「格」為單位畫一個方塊（x、y 是左上角，w 寬、h 高）
      const left = Math.round(x * unit);
      // 左邊換成像素（四捨五入，方塊之間才不會有細縫）
      const top = Math.round(y * unit);
      // 上邊換成像素
      const right = Math.round((x + w) * unit);
      // 右邊換成像素
      const bottom = Math.round((y + h) * unit);
      // 下邊換成像素
      ctx.fillStyle = color;
      // 設定顏色
      ctx.fillRect(left, top, right - left, bottom - top);
      // 畫出方塊
    }

    function drawSprite(context, sprite, colors, x, y, cellSize, flip) {
      // 畫一張點陣圖
      // context：畫在哪張畫布上；sprite：點陣圖；colors：字母對應的顏色
      // x、y：左上角（格）；cellSize：一格幾像素；flip：要不要左右翻轉
      const width = sprite[0].length;
      // 點陣圖有幾格寬
      for (let row = 0; row < sprite.length; row++) {
        // 一列一列畫
        for (let col = 0; col < width; col++) {
          // 一格一格畫
          let letter = sprite[row][col];
          // 這一格的字母
          if (flip) {
            letter = sprite[row][width - 1 - col];
            // 要翻轉的話，從右邊往左讀
          }
          if (letter === '.') {
            continue;
            // 「.」是透明的，不用畫
          }
          context.fillStyle = colors[letter];
          // 找出這個字母的顏色
          const left = Math.round((x + col) * cellSize);
          const top = Math.round((y + row) * cellSize);
          const right = Math.round((x + col + 1) * cellSize);
          const bottom = Math.round((y + row + 1) * cellSize);
          // 算出這一格的像素位置
          context.fillRect(left, top, right - left, bottom - top);
          // 畫出這一格
        }
      }
    }

    function pixelLine(x0, y0, x1, y1, color) {
      // 用一格一格的方塊畫一條粗粗的點陣線（釣竿用）
      const steps = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0));
      // 要畫幾格（取橫、直距離比較長的那個）
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        // 走到線的幾分之幾
        rect(Math.round(x0 + (x1 - x0) * t), Math.round(y0 + (y1 - y0) * t), 1, 1, color);
        // 在那個位置畫一格
      }
    }

    function random(min, max) {
      // 產生 min 到 max 之間的隨機數字
      return min + Math.random() * (max - min);
    }


    // ---------- 6. 畫面大小 ----------

    function resize() {
      // 螢幕大小改變時（包含一開始），重新計算畫布和格子大小
      const ratio = window.devicePixelRatio || 1;
      // 螢幕的像素倍數（手機通常是 2 或 3）
      const width = window.innerWidth;
      // 螢幕寬
      const height = window.innerHeight;
      // 螢幕高
      canvas.style.width = width + 'px';
      // 畫布看起來的寬
      canvas.style.height = height + 'px';
      // 畫布看起來的高
      canvas.width = Math.round(width * ratio);
      // 畫布實際的像素寬
      canvas.height = Math.round(height * ratio);
      // 畫布實際的像素高
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      // 畫筆自動放大倍數，之後都用「看起來的像素」來畫

      unit = Math.min(width / GAME_WIDTH, height / MIN_GAME_HEIGHT);
      // 一格有多大：橫的至少放得下 GAME_WIDTH 格，直的至少放得下 MIN_GAME_HEIGHT 格（取比較小的）
      gameWidth = width / unit;
      // 螢幕寬有幾格（平板會比 72 格多，看得到更寬的湖）
      gameHeight = height / unit;
      // 螢幕高有幾格
      waterTop = Math.round(gameHeight * 0.38);
      // 水面在 38% 的高度

      makeScenery();
      // 依新的大小重新擺放風景
      for (let i = 0; i < fishes.length; i++) {
        keepFishInWater(fishes[i]);
        // 確保魚還在水裡（螢幕轉向後水的範圍會變）
      }
    }

    function makeScenery() {
      // 隨機擺放樹、花、雲、水波（只在畫面大小改變時做一次）
      scenery.trees = [];
      for (let x = -2; x < gameWidth; x = x + random(4, 8)) {
        scenery.trees.push({ x: Math.round(x), y: Math.round(waterTop * 0.62 + random(-2, 1)) });
        // 在遠方草地上，每隔 4~8 格種一棵樹
      }
      scenery.flowers = [];
      for (let i = 0; i < 14; i++) {
        scenery.flowers.push({
          x: Math.round(random(1, gameWidth - 2)),
          y: Math.round(random(waterTop * 0.78, waterTop - 3)),
          color: Math.random() < 0.5 ? '#ffffff' : '#ffe066'
          // 一半白花、一半黃花
        });
      }
      scenery.clouds = [];
      for (let i = 0; i < 4; i++) {
        scenery.clouds.push({ x: random(0, gameWidth), y: Math.round(random(3, waterTop * 0.3)), speed: random(0.6, 1.5) });
        // 4 朵雲，每朵飄的速度不一樣
      }
      scenery.ripples = [];
      for (let i = 0; i < 14; i++) {
        scenery.ripples.push({ x: random(0, gameWidth), y: Math.round(random(waterTop + 2, gameHeight - 2)), length: Math.round(random(3, 8)) });
        // 水面上淡淡的波紋
      }
    }


    // ---------- 7. 畫背景 ----------

    function drawBackground() {
      // 天空：上深下淺的三條藍色帶（點陣風格不用漸層，用一條一條的顏色）
      rect(0, 0, gameWidth, waterTop, '#4dabf7');
      rect(0, waterTop * 0.25, gameWidth, waterTop, '#74c0fc');
      rect(0, waterTop * 0.45, gameWidth, waterTop, '#a5d8ff');

      // 太陽：用方塊拼成的圓
      drawSun(gameWidth - 12, 6);

      // 雲
      for (let i = 0; i < scenery.clouds.length; i++) {
        const cloud = scenery.clouds[i];
        let x = (cloud.x + totalTime * cloud.speed) % (gameWidth + 20) - 10;
        // 雲慢慢往右飄，飄出右邊就從左邊回來（% 是「除完的餘數」）
        x = Math.round(x);
        // 對齊格子
        rect(x + 2, cloud.y, 8, 2, '#ffffff');
        rect(x, cloud.y + 2, 13, 2, '#ffffff');
        // 兩個白色長方塊疊在一起，就是一朵點陣雲
      }

      // 山：一格一格算出每一直排的山有多高
      const mountainBase = Math.round(waterTop * 0.68);
      // 山腳的位置
      const peaks = [[gameWidth * 0.13, 12], [gameWidth * 0.45, 16], [gameWidth * 0.8, 13]];
      // 三座山的 [位置, 高度]（位置用「畫面寬的幾成」，畫面變寬時山也會跟著排好）
      for (let x = 0; x < gameWidth; x++) {
        let height = 0;
        // 這一排山的高度，先設 0
        for (let p = 0; p < peaks.length; p++) {
          const h = peaks[p][1] - Math.abs(x - peaks[p][0]) * 0.8;
          // 離山頂越遠越矮（像三角形）
          if (h > height) {
            height = h;
            // 取最高的那座山
          }
        }
        height = Math.round(height);
        if (height > 0) {
          rect(x, mountainBase - height, 1, height, '#4c6ef5');
          // 山的本體（藍紫色）
          rect(x, mountainBase - height, 1, Math.min(3, height), '#dbe4ff');
          // 山頂上 3 格白雪
        }
      }

      // 遠方的草地和樹
      rect(0, mountainBase, gameWidth, waterTop - mountainBase, '#82c91e');
      // 草地
      for (let i = 0; i < scenery.trees.length; i++) {
        drawSprite(ctx, TREE_SPRITE, TREE_COLORS, scenery.trees[i].x, scenery.trees[i].y, unit, false);
        // 一棵一棵畫樹
      }
      rect(0, waterTop * 0.78, gameWidth, waterTop * 0.22, '#94d82d');
      // 近處比較亮的草地
      for (let i = 0; i < scenery.flowers.length; i++) {
        rect(scenery.flowers[i].x, scenery.flowers[i].y, 1, 1, scenery.flowers[i].color);
        // 小花（一格）
      }
      rect(0, waterTop - 2, gameWidth, 2, '#5c940d');
      // 岸邊深綠色的邊

      // 水：上淺下深的藍色帶
      rect(0, waterTop, gameWidth, gameHeight - waterTop, '#339af0');
      rect(0, waterTop + (gameHeight - waterTop) * 0.35, gameWidth, gameHeight, '#228be6');
      rect(0, waterTop + (gameHeight - waterTop) * 0.7, gameWidth, gameHeight, '#1c7ed6');
      for (let i = 0; i < scenery.ripples.length; i++) {
        const ripple = scenery.ripples[i];
        const x = Math.round(ripple.x + Math.sin(totalTime * 0.8 + i) * 2);
        // 波紋左右輕輕晃動（sin 會在 -1 到 1 之間來回變化）
        rect(x, ripple.y, ripple.length, 1, 'rgba(255, 255, 255, 0.25)');
        // 半透明的白色短線
      }
    }

    function drawSun(centerX, centerY) {
      // 用方塊拼出一個點陣太陽
      for (let dy = -4; dy <= 4; dy++) {
        for (let dx = -4; dx <= 4; dx++) {
          if (dx * dx + dy * dy <= 17) {
            // 在半徑大約 4 格的圓裡面
            rect(centerX + dx, centerY + dy, 1, 1, '#ffe066');
          }
        }
      }
    }


    // ---------- 8. 魚 ----------

    function makeFish(fromSide) {
      // 產生一條新的魚
      const direction = Math.random() < 0.5 ? -1 : 1;
      // 往左游（-1）或往右游（1），一半一半
      const lane = pickLane();
      // 挑一條沒有魚的「水道」（每條魚游在不同高度，字才不會被擋住）
      const character = pickCharacter();
      // 身上的字
      const stage = getStage(character);
      // 這個字學到哪個階段（決定魚的大小）
      let colors = FISH_COLORS[Math.floor(random(0, FISH_COLORS.length))];
      // 隨機挑一種顏色
      if (stage === 3) {
        colors = GOLD_COLORS;
        // 已經學會的字：金色
      }
      const fish = {
        x: random(0, gameWidth - 22),
        // 橫的位置（格）
        y: laneY(lane),
        // 直的位置（格）：水道的高度
        lane: lane,
        // 在第幾條水道
        direction: direction,
        // 游的方向
        speed: random(5, 9),
        // 每秒游幾格
        colors: colors,
        // 顏色
        character: character,
        // 身上的字
        stage: stage,
        // 階段（0 小魚、1 中魚、2 大魚、3 金色的魚）
        scale: FISH_SIZES[stage],
        // 大小
        fleeing: false
        // 是不是正在逃跑
      };
      if (fromSide) {
        fish.x = direction === 1 ? -fishWidth(fish) : gameWidth;
        // 新的魚從畫面外面游進來
      }
      return fish;
    }

    function laneY(lane) {
      // 第 lane 條水道的高度（格）：從提示框下面到水底，平均分成 FISH_COUNT 條
      const top = waterTop + 12;
      // 最上面的水道（避開提示框）
      const bottom = gameHeight - 15;
      // 最下面的水道（中魚身高 13 格，留一點空間；大魚會稍微超過，沒關係）
      return top + (bottom - top) * lane / (FISH_COUNT - 1);
    }

    function pickLane() {
      // 找一條目前沒有魚的水道
      for (let lane = 0; lane < FISH_COUNT; lane++) {
        let used = false;
        for (let j = 0; j < fishes.length; j++) {
          if (fishes[j].lane === lane) {
            used = true;
            // 這條水道已經有魚了
          }
        }
        if (!used) {
          return lane;
          // 找到空的水道
        }
      }
      return 0;
      // 都滿了（理論上不會發生）就用第一條
    }

    function pickCharacter() {
      // 挑一個「目前水裡沒有的字」
      // 還在學的字比較常出現；已經學會的字（金色的魚）只有 GOLD_CHANCE 的機率出現
      const learning = [];
      // 還在學的字
      const mastered = [];
      // 已經學會的字
      for (let i = 0; i < WORDS.length; i++) {
        const character = WORDS[i].character;
        let used = false;
        for (let j = 0; j < fishes.length; j++) {
          if (fishes[j].character === character) {
            used = true;
            // 這個字已經有魚帶著了
          }
        }
        if (used) {
          continue;
          // 水裡已經有，跳過
        }
        if (getStage(character) === 3) {
          mastered.push(character);
        } else {
          learning.push(character);
        }
      }
      if (mastered.length > 0 && (learning.length === 0 || Math.random() < GOLD_CHANCE)) {
        return mastered[Math.floor(random(0, mastered.length))];
        // 擲中機率（或沒有還在學的字了）→ 出一條金色的魚
      }
      if (learning.length > 0) {
        return learning[Math.floor(random(0, learning.length))];
        // 平常：出一條還在學的字
      }
      return WORDS[Math.floor(random(0, WORDS.length))].character;
      // 所有字都已經在水裡了：隨便挑一個
    }

    function fishWidth(fish) {
      // 這條魚有幾格寬（原本 22 格，乘上大小）
      return 22 * fish.scale;
    }

    function fishHeight(fish) {
      // 這條魚有幾格高（原本 13 格，乘上大小）
      return 13 * fish.scale;
    }

    function keepFishInWater(fish) {
      // 魚的上下位置不要超出水的範圍
      fish.y = Math.min(Math.max(fish.y, waterTop + 4), gameHeight - 2 - fishHeight(fish));
    }

    function fishMouth(fish) {
      // 魚嘴巴的位置（格）：往左游時嘴在左邊，往右游時嘴在右邊
      const mouthY = fish.y + 6.5 * fish.scale;
      // 嘴巴在魚身高度的一半
      if (fish.direction === -1) {
        return { x: fish.x, y: mouthY };
      }
      return { x: fish.x + fishWidth(fish), y: mouthY };
    }

    function drawFish(fish, wiggle) {
      // 畫一條魚，再把國字寫在牠的肚子上
      const x = Math.round(fish.x + wiggle);
      // 對齊格子（wiggle 是咬鉤時左右掙扎的距離）
      const y = Math.round(fish.y);
      const scale = fish.scale;
      // 魚的大小
      drawSprite(ctx, FISH_SPRITE, fish.colors, x / scale, y / scale, unit * scale, fish.direction === 1);
      // 每一格放大 scale 倍來畫（位置要先除以 scale，因為 drawSprite 是用「放大後的格子」來算位置）
      // 往右游時左右翻轉
      let textCenterX = x + 10 * scale;
      // 肚子中間的位置（頭朝左時）
      if (fish.direction === 1) {
        textCenterX = x + 12 * scale;
        // 翻轉後肚子的位置
      }
      if (fish.stage === 3) {
        drawSparkles(x, y, scale);
        // 金色的魚：旁邊有閃閃的光點
      }
      ctx.fillStyle = '#212529';
      // 字的顏色
      ctx.font = 'bold ' + Math.round(unit * 6.5 * scale) + 'px "BiauKai", "Kaiti TC", "STKaiti", "TW-Kai", "DFKai-SB", "標楷體", serif';
      // 字的大小跟著格子大小變
      ctx.textAlign = 'center';
      // 左右置中
      ctx.textBaseline = 'middle';
      // 上下置中
      ctx.fillText(fish.character, textCenterX * unit, (y + 6.8 * scale) * unit);
      // 寫上國字
    }

    function drawSparkles(x, y, scale) {
      // 在金色的魚旁邊畫幾個會一閃一閃的白色光點
      const points = [[-2, 1], [24, 3], [5, -3], [19, 13], [-1, 11]];
      // 光點的位置（相對於魚的左上角，用原本大小的格子）
      for (let i = 0; i < points.length; i++) {
        if (Math.sin(totalTime * 4 + i * 1.7) > 0.2) {
          // 用 sin 讓每個光點在不同時間亮起來
          const px = Math.round(x + points[i][0] * scale);
          const py = Math.round(y + points[i][1] * scale);
          rect(px, py, 1, 1, '#ffffff');
          rect(px - 1, py, 3, 1, 'rgba(255, 255, 255, 0.6)');
          rect(px, py - 1, 1, 3, 'rgba(255, 255, 255, 0.6)');
          // 中間一格白點，加上十字形的淡光
        }
      }
    }

    function moveFishes(seconds) {
      // 讓每一條魚游動（seconds 是這一次經過了幾秒）
      for (let i = fishes.length - 1; i >= 0; i--) {
        // 從後面往前處理，因為中途可能會把魚移除
        const fish = fishes[i];
        if (fish === biter) {
          continue;
          // 正在咬鉤的魚另外處理
        }
        let speed = fish.speed;
        if (fish.fleeing) {
          speed = 30;
          // 逃跑的魚游很快
        }
        fish.x = fish.x + fish.direction * speed * seconds;
        // 往前游
        fish.y = fish.y + (laneY(fish.lane) - fish.y) * Math.min(seconds * 2, 1);
        // 慢慢回到自己的水道（追過魚鉤又放棄的魚、或螢幕轉向後，都會游回來）
        fish.y = fish.y + Math.sin(totalTime * 2 + i) * 0.05;
        // 上下輕輕浮動
        keepFishInWater(fish);
        if (fish.fleeing) {
          if (fish.x < -30 || fish.x > gameWidth + 8) {
            fishes.splice(i, 1);
            // 逃跑的魚游出畫面後就移除
            setTimeout(addFish, 1500);
            // 1.5 秒後補一條新的魚
          }
        } else if (fish.x < -4 && fish.direction === -1) {
          fish.direction = 1;
          // 游到左邊邊緣，轉頭往右
        } else if (fish.x > gameWidth - fishWidth(fish) + 4 && fish.direction === 1) {
          fish.direction = -1;
          // 游到右邊邊緣，轉頭往左
        }
      }
    }

    function addFish() {
      // 補一條魚（不超過 FISH_COUNT 條）
      if (fishes.length < FISH_COUNT) {
        fishes.push(makeFish(true));
      }
    }


    // ---------- 9. 角色和釣竿 ----------

    function playerPosition() {
      // 角色坐在岸邊右邊（格）
      return { x: gameWidth - 22, y: waterTop - 17 };
    }

    function rodTip() {
      // 釣竿尖端的位置（格）：從角色往左上方伸出去
      const player = playerPosition();
      return { x: player.x - 20, y: player.y - 7 };
    }

    function drawPlayerAndRod() {
      if (playerIndex === -1) {
        return;
        // 還沒選角色就不畫
      }
      const player = playerPosition();
      const tip = rodTip();
      let bend = 0;
      if (hookState === 'hooked') {
        bend = Math.round(Math.sin(totalTime * 20) * 1 + 2);
        // 魚咬鉤時，釣竿尖端被往下拉、還會抖動
      }
      pixelLine(player.x + 1, player.y + 11, tip.x, tip.y + bend, '#7f5539');
      // 釣竿（咖啡色的點陣線）：從角色的手到尖端
      drawSprite(ctx, PLAYERS[playerIndex].sprite, PLAYERS[playerIndex].colors, player.x, player.y, unit, false);
      // 畫角色（畫在釣竿上面，看起來像拿著釣竿）

      let hookX = tip.x + 0.5;
      let hookY = tip.y + 5;
      // 魚鉤沒放下去時，掛在釣竿尖端下面
      if (hookState !== 'idle') {
        hookX = hook.x;
        hookY = hook.y;
        // 放下去之後，用魚鉤真正的位置
      }
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
      // 釣魚線：白色
      ctx.lineWidth = 1.5;
      // 細細的
      ctx.beginPath();
      ctx.moveTo((tip.x + 0.5) * unit, (tip.y + bend + 0.5) * unit);
      // 從釣竿尖端
      ctx.lineTo(hookX * unit, hookY * unit);
      // 拉到魚鉤
      ctx.stroke();
      rect(Math.round(hookX) - 1, Math.round(hookY), 1, 1, '#e03131');
      rect(Math.round(hookX), Math.round(hookY), 1, 1, '#e03131');
      // 紅色的小魚鉤（兩格）
    }


    // ---------- 10. 畫面上方的提示和集氣條 ----------

    function drawTopPanel() {
      if (playerIndex === -1) {
        return;
        // 還沒選角色就不顯示
      }
      let text = message;
      // 暫時的提示（例如「魚跑掉了」）
      if (messageTimer <= 0) {
        // 沒有暫時提示，就依照魚鉤的狀態顯示
        if (hookState === 'idle') {
          text = '點一下水面，放下魚鉤';
        } else if (hookState === 'dropping' || hookState === 'waiting') {
          text = '等魚兒來咬鉤…';
        } else if (hookState === 'hooked') {
          text = '一直點畫面，把魚拉上來！';
        } else {
          text = '';
        }
      }
      if (text === '') {
        return;
      }

      const boxTop = Math.round(waterTop + 2);
      // 提示框放在水面下面一點點
      let boxHeight = 9;
      if (hookState === 'hooked') {
        boxHeight = 19;
        // 拉魚時框要高一點，放得下集氣條
      }
      rect(6, boxTop, gameWidth - 12, boxHeight, '#5c3d2e');
      // 咖啡色外框
      rect(7, boxTop + 1, gameWidth - 14, boxHeight - 2, '#fff9db');
      // 淡黃色底
      ctx.fillStyle = '#5c3d2e';
      ctx.font = 'bold ' + Math.round(unit * 4) + 'px "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, gameWidth / 2 * unit, (boxTop + 4.7) * unit);
      // 寫上提示文字

      if (hookState === 'hooked') {
        // 集氣條
        const barWidth = gameWidth - 24;
        // 集氣條的總長度
        rect(12, boxTop + 9, barWidth, 4, '#5c3d2e');
        // 集氣條的框
        rect(13, boxTop + 10, barWidth - 2, 2, '#e9ecef');
        // 空的部分（灰色）
        let barColor = '#ff922b';
        // 集氣條的顏色：橘色
        if (power > 70) {
          barColor = '#51cf66';
          // 快滿了變綠色
        }
        rect(13, boxTop + 10, Math.round((barWidth - 2) * power / 100), 2, barColor);
        // 已經集到的部分

        rect(12, boxTop + 15, barWidth, 1, '#ced4da');
        // 時間條的底
        rect(12, boxTop + 15, Math.round(barWidth * reelTimeLeft / REEL_TIME), 1, '#fa5252');
        // 剩下的時間（紅色，越來越短）
      }
    }


    // ---------- 11. 魚鉤和釣魚的流程 ----------

    function updateFishing(seconds) {
      if (hookState === 'dropping') {
        // 魚鉤慢慢往目標位置沉下去
        const dx = hookTarget.x - hook.x;
        const dy = hookTarget.y - hook.y;
        const distanceLeft = Math.sqrt(dx * dx + dy * dy);
        // 還差多遠
        const step = DROP_SPEED * seconds;
        // 這一次可以移動多遠
        if (distanceLeft <= step) {
          hook.x = hookTarget.x;
          hook.y = hookTarget.y;
          // 到了
          hookState = 'waiting';
          // 停在這裡等魚
          waitTime = 0;
          // 開始計算等了多久
        } else {
          hook.x = hook.x + dx / distanceLeft * step;
          hook.y = hook.y + dy / distanceLeft * step;
          // 往目標前進一步
        }
      }

      if ((hookState === 'dropping' || hookState === 'waiting') && biter === null) {
        // 魚鉤在水裡（不管是正在沉、還是已經停好），附近的魚「有機會」注意到它
        for (let i = 0; i < fishes.length; i++) {
          if (fishes[i].fleeing) {
            continue;
            // 正在逃跑的魚不算
          }
          const mouth = fishMouth(fishes[i]);
          const d = Math.hypot(mouth.x - hook.x, mouth.y - hook.y);
          // 魚嘴到魚鉤的距離（Math.hypot 就是畢氏定理算距離）
          let chance = NOTICE_WHILE_WAITING;
          // 魚鉤停好了：機率高
          if (hookState === 'dropping') {
            chance = NOTICE_WHILE_DROPPING;
            // 魚鉤還在沉：機率低
          }
          if (d < ATTRACT_DISTANCE && Math.random() < chance * seconds) {
            // 夠近，而且「擲骰子」擲中了 → 這條魚注意到魚鉤
            // （chance 是每秒的機率，乘上這一次經過的秒數，就是這一次的機率）
            biter = fishes[i];
            break;
            // 找到一條就好
          }
        }
        if (biter !== null && hookState === 'dropping') {
          hookState = 'waiting';
          // 有魚要來咬了，魚鉤停在原地等牠
        }
        if (biter === null && hookState === 'waiting') {
          waitTime = waitTime + seconds;
          // 還沒有魚，等待時間增加
          if (waitTime > MAX_WAIT) {
            biter = nearestFish();
            // 等太久了，讓最近的那條魚自己游過來
          }
        }
      }

      if (hookState === 'waiting' && biter !== null) {
        // 有魚正在游過來：讓牠的嘴巴往魚鉤靠近
        if (hook.x < biter.x + fishWidth(biter) / 2) {
          biter.direction = -1;
          // 魚鉤在魚的左邊，魚就面向左
        } else {
          biter.direction = 1;
          // 魚鉤在魚的右邊，魚就面向右
        }
        const mouth = fishMouth(biter);
        const dx = hook.x - mouth.x;
        const dy = hook.y - mouth.y;
        const d = Math.sqrt(dx * dx + dy * dy);
        const step = 18 * seconds;
        // 每秒游 18 格（注意到魚鉤後游得比平常快，小朋友不用等太久）
        if (d <= step) {
          biter.x = biter.x + dx;
          biter.y = biter.y + dy;
          // 咬到了！
          hookState = 'hooked';
          power = 0;
          // 集氣條歸零
          reelTimeLeft = REEL_TIME;
          // 開始倒數
        } else {
          biter.x = biter.x + dx / d * step;
          biter.y = biter.y + dy / d * step;
          // 往魚鉤游一點
        }
      }

      if (hookState === 'hooked') {
        power = power - POWER_DROP * seconds;
        // 集氣條自己慢慢掉
        if (power < 0) {
          power = 0;
        }
        reelTimeLeft = reelTimeLeft - seconds;
        // 時間減少
        if (power >= 100) {
          // 集滿了：魚跳出水面！
          hookState = 'leaping';
          leapTime = 0;
          leapStart = { x: biter.x, y: biter.y };
          // 記下起跳的位置
        } else if (reelTimeLeft <= 0) {
          // 時間到了：魚跑掉
          biter.fleeing = true;
          // 這條魚開始逃跑
          biter.direction = biter.direction * -1;
          // 轉頭游走
          biter = null;
          hookState = 'idle';
          // 魚鉤收回來
          showMessage('哎呀，魚跑掉了～再試一次！');
        }
      }

      if (hookState === 'leaping') {
        // 魚從水裡畫一道弧線飛到角色旁邊
        leapTime = leapTime + seconds;
        const t = Math.min(leapTime / 0.9, 1);
        // 動畫進度：0 到 1（0.9 秒跑完）
        const player = playerPosition();
        const endX = player.x - 26;
        const endY = player.y - 12;
        // 終點：角色左上方
        biter.x = leapStart.x + (endX - leapStart.x) * t;
        // 橫的方向：等速移動
        biter.y = leapStart.y + (endY - leapStart.y) * t - Math.sin(t * Math.PI) * 25;
        // 直的方向：再加上一個往上的拋物線（sin 讓中間最高）
        hook.x = fishMouth(biter).x;
        hook.y = fishMouth(biter).y;
        // 魚鉤跟著魚
        if (t >= 1) {
          hookState = 'caught';
          // 動畫結束，顯示「釣到了」視窗
          showCaughtScreen(biter);
          // 顯示「釣到了」視窗
        }
      }
    }

    function nearestFish() {
      // 找出嘴巴離魚鉤最近的魚（不算正在逃跑的）
      let nearest = null;
      let nearestDistance = Infinity;
      // 先假設無限遠
      for (let i = 0; i < fishes.length; i++) {
        if (fishes[i].fleeing) {
          continue;
        }
        const mouth = fishMouth(fishes[i]);
        const d = Math.hypot(mouth.x - hook.x, mouth.y - hook.y);
        if (d < nearestDistance) {
          nearest = fishes[i];
          nearestDistance = d;
          // 找到更近的就記下來
        }
      }
      return nearest;
    }

    function showCaughtScreen(fish) {
      // 依照魚的階段，顯示「釣到哪一種魚、要挑戰哪一關」
      caughtCharacterBox.textContent = fish.character;
      // 大大的國字
      document.getElementById('caughtTitle').textContent = '釣到一條' + STAGE_NAMES[fish.stage] + '！' + (fish.stage === 3 ? '✨' : '🎉');
      // 例如「釣到一條中魚！🎉」
      let levelText = LEVEL_NAMES[levelForStage(fish.stage)];
      // 例如「第二關：描紅」
      if (fish.stage === 3) {
        levelText = '複習一下（默寫）';
        // 金色的魚是複習
      }
      document.getElementById('caughtLevel').textContent = levelText;
      caughtScreen.classList.remove('hidden');
      // 打開視窗
    }

    function showMessage(text) {
      // 在畫面上方暫時顯示一段提示，2.5 秒後消失
      message = text;
      messageTimer = 2.5;
    }

    function finishCatch() {
      // 「釣到了」視窗關掉後：把那條魚移除、魚鉤收回、補新的魚
      caughtScreen.classList.add('hidden');
      const index = fishes.indexOf(biter);
      // 找出那條魚在清單裡的位置
      if (index !== -1) {
        fishes.splice(index, 1);
        // 從清單裡移除
      }
      biter = null;
      hookState = 'idle';
      setTimeout(addFish, 1500);
      // 1.5 秒後補一條新的魚
    }


    // ---------- 12. 點擊畫面 ----------

    canvas.addEventListener('pointerdown', function (event) {
      event.preventDefault();
      // 阻止瀏覽器原本的動作
      if (playerIndex === -1) {
        return;
        // 還沒選角色
      }
      const x = event.clientX / unit;
      const y = event.clientY / unit;
      // 點的位置換成「格」

      if (hookState === 'hooked') {
        power = power + TAP_POWER;
        // 拉魚中：每點一下集氣條增加
        return;
      }
      if (hookState === 'idle' || hookState === 'waiting' || hookState === 'dropping') {
        if (y > waterTop + 3) {
          // 點在水裡：把魚鉤放到那裡
          hook.x = x;
          hook.y = waterTop;
          // 魚鉤從點的位置「正上方的水面」開始，垂直往下沉
          if (biter !== null) {
            biter = null;
            // 換位置的話，本來游過來的魚就不追了
          }
          hookTarget.x = x;
          hookTarget.y = y;
          hookState = 'dropping';
        }
      }
    });


    // ---------- 13. 選角色 ----------

    function createPickButtons() {
      for (let i = 0; i < PLAYERS.length; i++) {
        const button = document.createElement('button');
        // 做一個按鈕
        button.className = 'pick-button';
        const preview = document.createElement('canvas');
        // 按鈕裡放一張小畫布，畫角色
        const cellSize = 5;
        // 每一格 5 像素
        const ratio = window.devicePixelRatio || 1;
        preview.style.width = 14 * cellSize + 'px';
        preview.style.height = 16 * cellSize + 'px';
        preview.width = 14 * cellSize * ratio;
        preview.height = 16 * cellSize * ratio;
        const previewContext = preview.getContext('2d');
        previewContext.setTransform(ratio, 0, 0, ratio, 0, 0);
        drawSprite(previewContext, PLAYERS[i].sprite, PLAYERS[i].colors, 0, 0, cellSize, false);
        // 把角色畫在小畫布上
        button.appendChild(preview);
        button.appendChild(document.createTextNode(PLAYERS[i].name));
        // 加上名字
        button.addEventListener('click', function () {
          playerIndex = i;
          // 記住選了誰
          savePlayer(i);
          // 也存進瀏覽器，下次回來不用再選
          pickScreen.classList.add('hidden');
          // 關掉選角色畫面
          changeButton.classList.remove('hidden');
          // 顯示「換角色」按鈕
        });
        pickList.appendChild(button);
      }
    }

    changeButton.addEventListener('click', function () {
      pickScreen.classList.remove('hidden');
      // 打開選角色畫面
    });


    // ---------- 14. 「釣到了」視窗的按鈕 ----------

    document.getElementById('practiceButton').addEventListener('click', function () {
      // 開始挑戰：依照魚的階段，前往對應的關卡，網址上帶著這個字
      // 例如 level2.html?char=山（encodeURIComponent 把中文字轉成網址可以用的格式）
      const level = levelForStage(biter.stage);
      window.location.href = 'level' + level + '.html?char=' + encodeURIComponent(biter.character);
    });

    document.getElementById('keepFishingButton').addEventListener('click', finishCatch);
    // 繼續釣魚


    // ---------- 15. 遊戲迴圈：每一格畫面都會執行一次 ----------

    function gameLoop(time) {
      // time 是瀏覽器給的「現在的時間」（毫秒）
      let seconds = (time - lastTime) / 1000;
      // 跟上一次差了幾秒
      lastTime = time;
      if (seconds > 0.1) {
        seconds = 0.1;
        // 如果切到別的分頁很久才回來，不要一次跳太多
      }
      totalTime = totalTime + seconds;
      if (messageTimer > 0) {
        messageTimer = messageTimer - seconds;
        // 暫時提示的倒數
      }

      if (hookState !== 'caught') {
        moveFishes(seconds);
        // 魚游動（顯示「釣到了」視窗時，畫面暫停）
        updateFishing(seconds);
        // 魚鉤和釣魚的流程
      }

      drawBackground();
      // 1. 先畫背景
      for (let i = 0; i < fishes.length; i++) {
        let wiggle = 0;
        if (fishes[i] === biter && hookState === 'hooked') {
          wiggle = Math.sin(totalTime * 30) * 1.2;
          // 咬鉤的魚左右掙扎
        }
        drawFish(fishes[i], wiggle);
        // 2. 再畫魚
      }
      drawPlayerAndRod();
      // 3. 角色、釣竿、魚線
      if (biter !== null && (hookState === 'hooked' || hookState === 'leaping')) {
        drawFish(biter, 0);
        // 被拉起來的魚畫在最上層，才不會被角色擋住
      }
      if (hookState === 'hooked' && biter !== null) {
        const mouth = fishMouth(biter);
        rect(Math.round(mouth.x) - 1, Math.round(biter.y) - 7, 2, 4, '#fa5252');
        rect(Math.round(mouth.x) - 1, Math.round(biter.y) - 2, 2, 1, '#fa5252');
        // 魚頭上的紅色驚嘆號「！」（用方塊拼的）
      }
      drawTopPanel();
      // 4. 最上面畫提示和集氣條

      requestAnimationFrame(gameLoop);
      // 請瀏覽器下一格畫面再呼叫一次 gameLoop
    }


    // ---------- 16. 網頁打開時 ----------

    resize();
    // 計算畫面大小
    for (let i = 0; i < FISH_COUNT; i++) {
      fishes.push(makeFish(false));
      // 放入一開始的魚
    }
    createPickButtons();
    // 做出選角色按鈕
    playerIndex = loadPlayer();
    // 讀出上次選的角色
    if (playerIndex >= 0 && playerIndex < PLAYERS.length) {
      pickScreen.classList.add('hidden');
      // 選過了（例如從關卡回來），直接開始釣魚
      changeButton.classList.remove('hidden');
    } else {
      playerIndex = -1;
      // 沒選過，顯示選角色畫面
    }
    window.addEventListener('resize', resize);
    // 螢幕大小改變時重新計算
    requestAnimationFrame(function (time) {
      lastTime = time;
      // 記下開始的時間
      requestAnimationFrame(gameLoop);
      // 開始遊戲迴圈
    });
  </script>
</body>
</html>
