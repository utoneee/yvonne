<!DOCTYPE html>
<!-- 告訴瀏覽器：這是一份 HTML5 網頁 -->
<html lang="zh-Hant">
<!-- 網頁的開始；lang="zh-Hant" 表示內容是繁體中文 -->

<head>
  <!-- head（頭部）：放網頁的設定，不會直接顯示在畫面上 -->

  <meta charset="UTF-8">
  <!-- 使用 UTF-8 編碼，中文才不會變成亂碼 -->

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 讓網頁在手機上依照螢幕寬度顯示 -->

  <title>終極密碼</title>
  <!-- 瀏覽器分頁上顯示的標題 -->

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
  <!-- 從 Google Fonts 載入圓圓的中文字體「粉圓體」 -->

  <style>
    /* ===== 這裡開始是 CSS：負責「長什麼樣子」 ===== */
    /* 風格：晚上在森林裡露營，扁平插畫風 */

    :root {
      /* 先把要用的顏色取好名字，後面就可以重複使用 */
      --sky-top: #0b1730;      /* 天空最上面：深夜藍 */
      --sky-bottom: #183a2c;   /* 天空下面：接近樹林的深綠 */
      --rock: #6f7378;         /* 岩石：灰色 */
      --rock-dark: #4c5056;    /* 岩石的陰影：深灰 */
      --wood: #8a5a2b;         /* 木頭：咖啡色 */
      --wood-dark: #5e3a17;    /* 木頭的深色紋路 */
      --paper: #fbeed3;        /* 米黃色：木頭招牌上的字 */
      --big: #ff8a7a;          /* 「太大了」用的紅橘色 */
      --small: #8fd3ff;        /* 「太小了」用的淺藍色 */
      --win: #ffe066;          /* 「答對了」用的金黃色 */
      --slate: #2b2e33;        /* 顯示數字的深色石板 */
      color-scheme: dark;      /* 告訴瀏覽器這是深色畫面 */
    }

    * {
      /* * 代表「所有元素」 */
      box-sizing: border-box;  /* 計算寬度時把邊框和內距算進去，排版比較好算 */
    }

    [hidden] {
      /* 有 hidden 的元素 */
      display: none !important; /* 一定要藏起來（!important 表示這條規則最優先） */
    }

    body {
      /* 整頁的樣式 */
      margin: 0;                                   /* 拿掉瀏覽器預設的外邊距 */
      min-height: 100vh;                           /* 至少跟螢幕一樣高 */
      font-family: "Huninn", "PingFang TC", "Microsoft JhengHei", sans-serif;
      /* 字體：先用粉圓體，沒有就換成電腦裡的中文字體 */
      color: var(--paper);                         /* 文字是米黃色 */
      text-align: center;                          /* 文字置中 */
      background-color: var(--sky-top);            /* 背景底色 */
      background-image:
        radial-gradient(2px 2px at 30px 40px, #ffffff, transparent),
        radial-gradient(1.5px 1.5px at 120px 90px, #ffffff, transparent),
        radial-gradient(2px 2px at 200px 30px, #fff7c2, transparent),
        radial-gradient(1px 1px at 260px 140px, #ffffff, transparent),
        radial-gradient(1.5px 1.5px at 80px 170px, #ffffff, transparent),
        linear-gradient(var(--sky-top), var(--sky-bottom));
      /* 前面五個小圓點是星星，最後一個是由深藍到深綠的天空 */
      background-size: 300px 220px, 300px 220px, 300px 220px, 300px 220px, 300px 220px, 100% 100%;
      /* 星星每 300×220 像素重複一次，就會滿天都是 */
      background-attachment: fixed;                /* 捲動時背景不會跟著跑 */
      padding: 10px 16px 12px;                     /* 上 10、左右 16、下 12（留少一點，畫面才放得下） */
      -webkit-user-select: none;                   /* 連點按鍵時不要選到文字（Safari 用） */
      user-select: none;                           /* 連點按鍵時不要選到文字 */
    }

    main {
      /* 主要內容區 */
      max-width: 460px;         /* 直的畫面最寬 460 像素 */
      margin: 0 auto;           /* 左右置中 */
    }

    .top {
      /* 最上面一排：左邊「回選單」、右邊「音效開關」 */
      display: flex;                    /* 並排 */
      justify-content: space-between;   /* 一個靠左、一個靠右 */
      align-items: center;              /* 上下置中 */
    }

    .back {
      /* 「回遊戲選單」連結 */
      color: var(--paper);      /* 米黃色字 */
      opacity: 0.8;             /* 稍微淡一點 */
      text-decoration: none;    /* 拿掉底線 */
    }

    #muteButton {
      /* 音效開關 */
      font-family: inherit;               /* 用網頁的字體 */
      font-size: 16px;                    /* 字大小 */
      color: var(--paper);                /* 米黃色字 */
      background: rgba(0, 0, 0, 0.25);    /* 半透明黑底 */
      border: 2px solid rgba(251, 238, 211, 0.4);  /* 淡淡的邊框 */
      border-radius: 999px;               /* 膠囊形狀 */
      padding: 4px 12px;                  /* 內部空間 */
      cursor: pointer;                    /* 滑鼠變手指 */
    }

    .playing h1 {
      /* 開始猜之後（body 加上 playing），藏起大標題，省下空間 */
      display: none;
    }

    h1 {
      /* 大標題「終極密碼」 */
      font-size: 40px;                            /* 大大的字 */
      margin: 4px 0 14px;                         /* 上 4、下 14 像素 */
      color: var(--win);                          /* 金黃色，像營火的光 */
      text-shadow: 0 0 16px rgba(255, 179, 71, 0.6);  /* 發光的效果 */
    }

    .rock {
      /* 岩石卡片 */
      background: linear-gradient(160deg, var(--rock), var(--rock-dark));
      /* 灰色漸層，像一塊大石頭 */
      border-radius: 42px 30px 48px 26px / 30px 44px 28px 40px;
      /* 四個角的圓弧都不一樣，看起來像天然的石頭 */
      box-shadow: inset 0 -10px 0 rgba(0, 0, 0, 0.2), 0 10px 24px rgba(0, 0, 0, 0.5);
      /* 第一個是石頭底部的暗面，第二個是石頭下面的影子 */
      padding: 20px 18px;        /* 卡片內部空間 */
    }

    .wood {
      /* 木頭招牌樣式（所有按鈕都用這個） */
      font-family: inherit;      /* 用跟網頁一樣的字體 */
      font-size: 22px;           /* 字的大小 */
      color: var(--paper);       /* 米黃色字 */
      background-color: var(--wood);  /* 咖啡色底 */
      background-image: repeating-linear-gradient(
        0deg,
        transparent 0px, transparent 7px,
        rgba(0, 0, 0, 0.12) 7px, rgba(0, 0, 0, 0.12) 9px
      );
      /* 每隔幾像素畫一條深色細線，看起來像木頭紋路 */
      border: 3px solid var(--wood-dark);    /* 深咖啡色的邊框 */
      border-radius: 10px;                   /* 小圓角 */
      box-shadow: 0 5px 0 var(--wood-dark);  /* 下方的厚度，看起來像一塊木板 */
      padding: 10px 22px;                    /* 按鈕內部空間 */
      cursor: pointer;                       /* 滑鼠移上去變成手指 */
      touch-action: manipulation;            /* 手機連點兩下時不要放大畫面 */
    }

    .wood:active {
      /* 按下按鈕的那一瞬間 */
      transform: translateY(4px);            /* 往下壓 4 像素 */
      box-shadow: 0 1px 0 var(--wood-dark);  /* 厚度變薄，像真的被按下去 */
    }

    .wood:focus-visible,
    #muteButton:focus-visible {
      /* 用鍵盤選到按鈕時 */
      outline: 3px solid var(--win);         /* 出現金黃色框框 */
      outline-offset: 3px;                   /* 框框離一點距離 */
    }

    /* ---------- 畫面一：選難度 ---------- */
    .info {
      /* 說明文字 */
      font-size: 20px;            /* 字大小 */
      margin: 0 0 14px;           /* 下面留 14 像素 */
    }

    .levels {
      /* 放五個難度按鈕的區域 */
      display: flex;              /* 用彈性排版 */
      flex-direction: column;     /* 由上往下排 */
      gap: 14px;                  /* 按鈕之間隔 14 像素 */
    }

    .levels .wood {
      /* 難度按鈕 */
      display: flex;                      /* 左邊放範圍、右邊放難度名稱 */
      justify-content: space-between;     /* 兩邊分開 */
      align-items: center;                /* 上下置中 */
      width: 100%;                        /* 跟卡片一樣寬 */
      font-size: 24px;                    /* 字大一點 */
    }

    .modes {
      /* 「單人」「雙人」兩個大按鈕 */
      display: grid;                          /* 格子排版 */
      grid-template-columns: 1fr 1fr;         /* 兩欄一樣寬 */
      gap: 14px;                              /* 中間隔 14 像素 */
    }

    .modes .wood,
    .animal {
      /* 模式按鈕和動物按鈕：圖案在上、字在下 */
      display: flex;                          /* 彈性排版 */
      flex-direction: column;                 /* 由上往下排 */
      align-items: center;                    /* 置中 */
      gap: 4px;                               /* 間隔 4 像素 */
      padding: 14px 8px;                      /* 內部空間 */
      font-size: 24px;                        /* 字大小 */
    }

    .face {
      /* 大大的動物圖（抽籤卡片、出題前蓋住的畫面） */
      font-size: 44px;                        /* 很大 */
      line-height: 1.1;                       /* 行高 */
    }

    .btnArt {
      /* 按鈕上的帳篷、營火圖 */
      width: 96px;                            /* 寬 96 像素 */
      height: 60px;                           /* 高 60 像素 */
    }

    .ring {
      /* 圓形的動物頭像：淡色底、動物顏色外框（--a 是動物顏色、--tint 是淡色） */
      display: inline-grid;                   /* 讓裡面的圖置中 */
      place-items: center;                    /* 置中 */
      width: 60px;                            /* 寬 60 像素 */
      height: 60px;                           /* 高 60 像素 */
      border-radius: 50%;                     /* 變成圓形 */
      border: 3px solid var(--a);             /* 動物顏色的外框 */
      background: var(--tint);                /* 很淡的底色 */
      overflow: hidden;                       /* 超出圓形的部分藏起來 */
    }

    .ring svg {
      /* 圓形裡的動物 */
      width: 88%;                             /* 比圓形小一點 */
      height: 88%;
      margin-top: 8%;                         /* 往下一點，看起來比較置中 */
    }

    .ring.big {
      /* 抽籤卡片、出題前畫面用的大頭像 */
      width: 76px;
      height: 76px;
    }

    .mini {
      /* 文字裡的小頭像：跟字一樣大 */
      display: inline-grid;
      place-items: center;
      width: 1.2em;                           /* em 是「一個字的大小」 */
      height: 1.2em;
      border-radius: 50%;
      border: 0.1em solid var(--a);
      background: var(--tint);
      overflow: hidden;
      vertical-align: -0.25em;                /* 跟文字對齊 */
      margin: 0 0.12em;                       /* 左右留一點空 */
    }

    .mini svg {
      width: 92%;
      height: 92%;
      margin-top: 10%;
    }

    .modes small,
    .animal small {
      /* 按鈕下面的小字 */
      font-size: 15px;                        /* 小一點 */
      opacity: 0.85;                          /* 淡一點 */
      min-height: 18px;                       /* 先佔好位置 */
    }

    .animals {
      /* 四隻動物排成 2×2 */
      display: grid;                          /* 格子排版 */
      grid-template-columns: repeat(2, 1fr);  /* 兩欄 */
      gap: 12px;                              /* 間隔 12 像素 */
    }

    .animal {
      /* 動物按鈕：邊框用動物自己的顏色（--a） */
      border-color: var(--a);                 /* 動物的顏色 */
    }

    .animal:disabled {
      /* 被玩家 1 選走的動物：變灰、不能按 */
      filter: grayscale(1);                   /* 變成黑白 */
      opacity: 0.45;                          /* 變淡 */
      cursor: default;                        /* 滑鼠不變手指 */
      transform: none;                        /* 按了也不會往下壓 */
    }

    .drawCards {
      /* 抽籤時的兩張動物卡片 */
      display: flex;                          /* 並排 */
      justify-content: center;                /* 置中 */
      gap: 18px;                              /* 中間隔 18 像素 */
      margin: 6px 0 12px;                     /* 上下留空 */
    }

    .drawCard {
      /* 一張抽籤卡片 */
      width: 120px;                           /* 寬 120 像素 */
      padding: 12px 6px;                      /* 內部空間 */
      border-radius: 18px;                    /* 圓角 */
      background: rgba(0, 0, 0, 0.25);        /* 深色底 */
      border: 4px solid transparent;          /* 先準備好透明的邊框 */
      font-size: 20px;                        /* 名字的大小 */
      transition: transform 0.08s, border-color 0.08s, background 0.08s;  /* 閃的時候有一點點動畫 */
    }

    .drawCard.on {
      /* 輪到這張卡片亮起來 */
      border-color: var(--a);                 /* 邊框變成動物的顏色 */
      background: rgba(255, 255, 255, 0.15);  /* 底變亮 */
      transform: scale(1.1);                  /* 變大一點 */
    }

    .drawCard span {
      /* 卡片上的「玩家 1／小兔」 */
      white-space: pre-line;                  /* 讓 \n 真的換行 */
      line-height: 1.3;                       /* 行高 */
    }

    #infoText.turn {
      /* 雙人時「輪到誰」那行：大一點、清楚一點 */
      font-size: 18px;                        /* 舊瀏覽器用 */
      font-size: min(19px, 5.4cqw);           /* 跟著牌子寬度縮放 */
      opacity: 1;                             /* 不要變淡 */
    }

    .cover {
      /* 出題前蓋住畫面的那張卡片 */
      background: #1a2c48;                    /* 深藍色 */
      border: 3px dashed #4b6a95;             /* 虛線框 */
      border-radius: 22px;                    /* 圓角 */
      padding: 24px 14px;                     /* 內部空間 */
      display: flex;                          /* 彈性排版 */
      flex-direction: column;                 /* 由上往下排 */
      align-items: center;                    /* 置中 */
      gap: 14px;                              /* 間隔 */
    }

    .cover p {
      /* 蓋住畫面上的字 */
      margin: 0;                              /* 拿掉預設空白 */
      font-size: 20px;                        /* 字大小 */
      line-height: 1.5;                       /* 行高 */
    }

    #setDisplay {
      /* 出題時的數字石板：跟遊戲裡的一樣 */
      flex: 1;                                /* 佔掉旁邊按鈕以外的寬度 */
      font-size: 32px;                        /* 大字 */
      letter-spacing: 6px;                    /* 字距 */
      min-height: 52px;                       /* 高度 */
      line-height: 46px;                      /* 上下置中 */
      background: var(--slate);               /* 深色石板 */
      border: 3px solid var(--rock-dark);     /* 邊框 */
      border-radius: 14px;                    /* 圓角 */
    }

    #setDisplay.empty { opacity: 0.4; }      /* 還沒打：淡淡的問號 */

    #setPeek {
      /* 出題時的「看一下」按鈕 */
      font-size: 14px;                        /* 字小一點 */
      line-height: 1.2;                       /* 行高 */
      padding: 0 10px;                        /* 左右內距 */
      -webkit-touch-callout: none;            /* iPhone 長按不要跳出選單 */
      touch-action: none;                     /* 按著時不要捲動畫面 */
    }

    #setErr {
      /* 打錯時的提醒 */
      color: var(--big);                      /* 紅橘色 */
      min-height: 22px;                       /* 先佔好位置 */
      margin: 6px 0;                          /* 上下留一點空 */
      font-size: 15px;                        /* 字大小 */
    }

    .hintButtons {
      /* 提示按鈕：由上往下排 */
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #drawText {
      /* 「🐰 小兔先猜！」 */
      font-size: 26px;                        /* 大字 */
      min-height: 36px;                       /* 先佔好位置 */
      color: var(--win);                      /* 金黃色 */
      margin: 0;                              /* 拿掉預設空白 */
    }

    #infoText.flash {
      /* 換人的時候，「輪到誰」那行跳一下 */
      animation: turnPop 0.5s ease-out;
    }

    @keyframes turnPop {
      /* 跳一下：先變大再變回來 */
      from { transform: scale(1.35); }
      to   { transform: scale(1); }
    }

    .levels small {
      /* 難度按鈕右邊的小字（例如「超簡單」） */
      font-size: 17px;            /* 小一點 */
      opacity: 0.85;              /* 稍微淡一點 */
    }

    /* ---------- 畫面二：猜數字（場景＋鍵盤兩塊） ---------- */
    .board {
      /* 包住「營火場景」和「鍵盤區」 */
      display: flex;              /* 彈性排版 */
      flex-direction: column;     /* 直的畫面：上下排（場景在上、鍵盤在下） */
      gap: 10px;                  /* 兩塊之間隔 10 像素 */
      margin-top: 8px;            /* 跟最上面一排隔開 */
    }

    .camp,
    .pad {
      /* 場景區和鍵盤區 */
      flex: 1;                    /* 橫的時候兩塊一樣寬 */
      min-width: 0;               /* 內容太長時不要把版面撐破 */
    }

    .sceneWrap {
      /* 包住場景圖和上面的文字牌子 */
      position: relative;         /* 讓文字牌子可以「疊」在場景上 */
    }

    .scene {
      /* 森林帳篷場景（SVG 圖） */
      display: block;             /* 自己佔一整行 */
      width: 100%;                /* 跟外框一樣寬 */
      aspect-ratio: 400 / 350;    /* 寬高比例跟畫布一樣 */
      height: auto;               /* 高度照比例自動算 */
      max-height: calc(100vh - 394px);   /* 舊瀏覽器用：最高不能超過「螢幕高度 - 鍵盤那些的高度」 */
      max-height: calc(100dvh - 394px);  /* 新瀏覽器用：dvh 會扣掉手機瀏覽器的網址列，比較準 */
      min-height: 190px;          /* 但最少也要 190 像素高 */
      margin: 0 auto;             /* 置中 */
      border-radius: 22px;        /* 圓角 */
    }

    .sign {
      /* 疊在夜空上的半透明小牌子 */
      position: absolute;              /* 自由擺放 */
      top: 8px;                        /* 離場景上緣 8 像素 */
      left: 50%;                       /* 從中間開始 */
      transform: translateX(-50%);     /* 往左移自己寬度的一半 → 剛好置中 */
      width: 84%;                      /* 寬度是場景的 84% */
      background: rgba(8, 18, 36, 0.62);  /* 半透明深藍色，字才看得清楚 */
      border-radius: 14px;             /* 圓角 */
      padding: 6px 10px;               /* 內部空間 */
      container-type: inline-size;     /* 讓裡面的字可以「照牌子寬度」決定大小（cqw 單位） */
      white-space: nowrap;             /* 字永遠不換行 */
    }

    #infoText {
      /* 範圍說明 */
      font-size: 15px;            /* 舊瀏覽器用的字大小 */
      font-size: min(15px, 4.6cqw);  /* 新瀏覽器：最大 15 像素，牌子變窄時跟著縮小（cqw = 牌子寬度的 1%） */
      margin: 0;                  /* 拿掉預設空白 */
      opacity: 0.9;               /* 稍微淡一點 */
    }

    #message {
      /* 顯示「太大了」「太小了」「答對了！」 */
      font-size: 22px;            /* 舊瀏覽器用的字大小 */
      font-size: min(24px, 6cqw);    /* 新瀏覽器：最大 24 像素，放不下就自動縮小 */
      line-height: 1.35;          /* 行高 */
      margin: 2px 0;              /* 上下留一點空 */
    }

    .big   { color: var(--big); }    /* 太大了：紅橘色 */
    .small { color: var(--small); }  /* 太小了：淺藍色 */
    .win   { color: var(--win); }    /* 答對了：金黃色 */

    #hintText {
      /* 互相出題時的「💡 提示」那一行 */
      font-size: 14px;                /* 舊瀏覽器用 */
      font-size: min(15px, 4.4cqw);   /* 跟著牌子寬度縮放 */
      color: #ffe7a3;                 /* 淡黃色 */
      margin: 0;                      /* 拿掉預設空白 */
    }

    #countText {
      /* 猜了幾次（偷看時會暫時變成範圍） */
      font-size: 15px;            /* 舊瀏覽器用的字大小 */
      font-size: min(15px, 4.6cqw);  /* 新瀏覽器：跟著牌子寬度縮放 */
      margin: 0;                  /* 拿掉預設空白 */
    }

    #countText.peek {
      /* 偷看時：金黃色、大一點 */
      color: var(--win);
      font-size: min(18px, 5.4cqw);
    }

    .screenRow {
      /* 數字石板＋偷看按鈕，放在同一排 */
      display: flex;              /* 並排 */
      gap: 10px;                  /* 中間隔 10 像素 */
      margin-bottom: 10px;        /* 下面留空 */
    }

    #peekButton {
      /* 「偷看」按鈕 */
      font-size: 15px;             /* 字小一點 */
      line-height: 1.2;            /* 行高 */
      padding: 0 10px;             /* 左右內距 */
      -webkit-touch-callout: none; /* iPhone 長按時不要跳出選單 */
      touch-action: none;          /* 手指按著時不要捲動畫面 */
    }

    /* ---------- 場景裡的動畫 ---------- */
    .fire, .outer, .inner, .puff, .flash, .ember, .scraper {
      transform-box: fill-box;    /* 變形時以「自己」為準，不是以整張圖為準 */
    }

    .light {
      /* 火光：整張圖蓋一層橘色光，一開始看不到 */
      opacity: 0;
    }
    .lit .light {
      /* 點著後（場景加上 lit）：慢慢亮起來，之後微微閃動 */
      animation: lightIn 2.6s ease-in forwards, glowPulse 1.1s ease-in-out 2.6s infinite alternate;
    }
    @keyframes lightIn { from { opacity: 0; } to { opacity: 1; } }      /* 從看不到 → 看得到 */
    @keyframes glowPulse { from { opacity: 1; } to { opacity: 0.75; } } /* 亮 → 稍暗，來回 */

    .logrect { transition: fill 0.8s; }        /* 木柴換顏色時慢慢換 */
    .lit .logrect { fill: #5a2f12; }           /* 點著後木柴燒黑 */

    .ember { opacity: 0; transform-origin: center; }  /* 木柴上的紅點：平常看不到 */
    .ember-on .ember { animation: emberGlow 0.9s ease-in-out both; }  /* 閃一下 */
    .lit .ember { opacity: 1; animation: emberStay 0.8s ease-in-out infinite alternate; }  /* 點著後一直亮 */
    @keyframes emberGlow {
      0%   { opacity: 0; }                          /* 看不到 */
      35%  { opacity: 1; transform: scale(1.4); }   /* 亮起來、變大 */
      100% { opacity: 0; }                          /* 又暗掉 */
    }
    @keyframes emberStay { from { opacity: 1; } to { opacity: 0.55; } }  /* 一明一暗 */

    .fire {
      /* 整團火：一開始縮到看不見 */
      transform-origin: 50% 100%;   /* 從底部中間長大 */
      transform: scale(0);          /* 大小是 0 */
    }
    .lit .fire {
      /* 點著後播放 grow 動畫 */
      animation: grow 2.6s ease-out forwards;  /* forwards：播完停在最後的樣子 */
    }
    @keyframes grow {
      /* 一小簇 →「呼」→「呼」→ 大火 */
      0%   { transform: scale(0.08); }   /* 很小一簇 */
      14%  { transform: scale(0.22); }   /* 稍微變大 */
      26%  { transform: scale(0.18); }   /* 縮一下 */
      44%  { transform: scale(0.52); }   /* 呼！變大 */
      56%  { transform: scale(0.46); }   /* 縮一下 */
      80%  { transform: scale(1.1); }    /* 呼！比正常還大 */
      100% { transform: scale(1); }      /* 正常大小 */
    }
    .outer { transform-origin: 50% 100%; animation: sway 0.7s ease-in-out infinite alternate; }
    /* 橘色外層火舌：0.7 秒一次，左右擺 */
    .inner { transform-origin: 50% 100%; animation: sway 0.55s ease-in-out infinite alternate-reverse; }
    /* 黃色內層火舌：0.55 秒一次，跟外層反方向擺 */
    @keyframes sway {
      from { transform: skewX(-7deg) scale(1, 1); }      /* 往左歪 */
      to   { transform: skewX(7deg) scale(0.94, 1.1); }  /* 往右歪、變高 */
    }

    .puff { opacity: 0; transform-origin: center; }    /* 白煙：平常看不到 */
    .smoke .puff { animation: puff 2.2s ease-out both; }  /* 冒煙時往上飄 */
    @keyframes puff {
      0%   { opacity: 0;    transform: translate(0, 0) scale(0.3); }        /* 小小一團 */
      12%  { opacity: 0.95; }                                               /* 出現 */
      55%  { transform: translate(calc(var(--sx) * 0.5), -70px) scale(1.4); } /* 飄高、變大 */
      100% { opacity: 0;    transform: translate(var(--sx), -135px) scale(2.2); } /* 飄更高、散掉 */
    }

    .striker { transition: opacity 0.6s; }   /* 打火棒消失時慢慢淡出 */

    .strikerPos {
      /* 打火棒的位置：換位置時花 0.7 秒滑過去 */
      transition: transform 0.7s ease-in-out, opacity 0.5s;
    }
    .strikerPos.solo  { transform: translate(292px, 128px) rotate(-25deg); }
    /* 一堆火：在右上方，尖端朝向中間的火 */
    .strikerPos.sideL { transform: translate(202px, 128px) rotate(-25deg); }
    /* 兩堆火、輪到左邊：尖端朝向左邊的火 */
    .strikerPos.sideR { transform: translate(198px, 128px) scale(-1, 1) rotate(-25deg); }
    /* 兩堆火、輪到右邊：scale(-1, 1) 是左右翻過來，從左上方伸向右邊的火 */
    .strikerPos.gone  { opacity: 0; }
    /* 兩堆火都點著了：打火棒收起來 */

    .scene:not(.duo) .duoOnly { display: none; }
    /* 一堆火的時候，藏起「兩堆火才有的東西」（:not 是「不是」） */
    .scene.duo .soloOnly { display: none; }
    /* 兩堆火的時候，藏起「一堆火才有的東西」 */

    .reflect { opacity: 0; transition: opacity 2.4s ease-in; }
    /* 湖面的火光倒影：平常看不到 */
    .scene.lit .reflectSolo,
    .scene.litL .reflectL,
    .scene.litR .reflectR { opacity: 0.8; }
    /* 火點著後慢慢出現（litL／litR 是左邊、右邊的火點著了） */

    .placeTag {
      /* 選難度畫面上的「今晚的營地」小牌子 */
      display: inline-flex;                   /* 圖和字並排 */
      align-items: center;                    /* 上下置中 */
      gap: 8px;                               /* 間隔 */
      background: rgba(8, 18, 36, 0.45);      /* 半透明深色 */
      border-radius: 999px;                   /* 膠囊形狀 */
      padding: 4px 14px 4px 8px;              /* 內部空間 */
      font-size: 17px;                        /* 字大小 */
      margin: 0 0 10px;                       /* 下面留空 */
    }
    .placeTag svg { width: 34px; height: 24px; }   /* 小帳篷圖 */
    .placeTag b { color: var(--win); font-weight: 400; }   /* 營地名字用金黃色 */

    .badgeCircle { transition: stroke-width 0.3s; }
    /* 火堆旁的動物圓章 */
    .badgeCircle.active { stroke-width: 4; }
    /* 輪到的人：圓章的白框變粗 */
    .lit .striker { opacity: 0; }            /* 點著後就收起來 */

    .scraper { transform-origin: 50% 100%; } /* 刮刀以底部為中心轉動 */
    .strike .scraper { animation: scrape 1.2s ease-in-out; }  /* 刷一下時播放 */
    @keyframes scrape {
      0%   { transform: translate(0, 0) rotate(0); }            /* 原位 */
      20%  { transform: translate(0, 4px) rotate(0); }          /* 壓在鎂棒上 */
      35%  { transform: translate(9px, 4px) rotate(8deg); }     /* 往手把方向收 */
      40%  { transform: translate(9px, 4px) rotate(-6deg); animation-timing-function: cubic-bezier(0.5, 0, 0.9, 0.6); }
      /* 準備用力（後面這段越刷越快） */
      68%  { transform: translate(-90px, 4px) rotate(-10deg); } /* 刷到尖端！ */
      80%  { transform: translate(-100px, -16px) rotate(-18deg); opacity: 1; } /* 抬起來 */
      88%  { opacity: 0; }                                       /* 消失 */
      98%  { transform: translate(0, 0); opacity: 0; }           /* 偷偷回到原位 */
      100% { opacity: 1; }                                       /* 再出現 */
    }

    .flash { opacity: 0; transform-origin: center; }   /* 尖端的閃光：平常看不到 */
    .strike .flash { animation: flash 1.2s linear; }   /* 刷一下時播放 */
    @keyframes flash {
      0%, 66%   { opacity: 0; transform: scale(0.2) rotate(0); }      /* 刷到尖端前都看不到 */
      70%       { opacity: 1; transform: scale(1.35) rotate(20deg); } /* 唷！閃一下 */
      82%       { opacity: 0.7; transform: scale(1) rotate(35deg); }  /* 慢慢變小 */
      95%, 100% { opacity: 0; transform: scale(0.5) rotate(45deg); }  /* 消失 */
    }

    #sparks { filter: drop-shadow(0 0 2px #ffb347); }  /* 火星發光 */
    .spark { opacity: 0; animation: fly 0.85s ease-out both; }  /* 每顆火星播放 fly */
    @keyframes fly {
      0%   { opacity: 0; transform: translate(0, 0); }                         /* 在尖端，還看不到 */
      2%   { opacity: 1; }                                                     /* 噴出來 */
      58%  { opacity: 1; transform: translate(var(--dx), var(--dy)); }         /* 飛到木柴 */
      72%  { transform: translate(calc(var(--dx) * 1.1), calc(var(--dy) - var(--hop))); }  /* 彈起來 */
      86%  { opacity: 0.9; transform: translate(calc(var(--dx) * 1.18), var(--dy)); }      /* 落下 */
      100% { opacity: 0; transform: translate(calc(var(--dx) * 1.18), var(--dy)); }        /* 熄掉 */
    }

    /* ---------- 數字鍵盤 ---------- */
    #display {
      /* 顯示打了什麼數字的石板 */
      flex: 1;                            /* 佔掉偷看按鈕以外的寬度 */
      font-size: 36px;                    /* 數字大大的 */
      letter-spacing: 4px;                /* 數字之間拉開一點 */
      min-height: 52px;                   /* 高度固定，不會跳 */
      line-height: 46px;                  /* 讓數字上下置中 */
      background: var(--slate);           /* 深色石板 */
      border: 3px solid var(--rock-dark); /* 深灰色邊 */
      border-radius: 14px;                /* 圓角 */
      font-variant-numeric: tabular-nums; /* 每個數字一樣寬，比較整齊 */
    }

    #display.empty {
      /* 還沒輸入時，顯示淡淡的問號 */
      opacity: 0.4;                       /* 變淡 */
    }

    .keys {
      /* 12 個按鍵排成 3 欄 4 列 */
      display: grid;                          /* 用格子排版 */
      grid-template-columns: repeat(3, 1fr);  /* 3 欄，每欄一樣寬 */
      gap: 10px;                              /* 按鍵之間隔 10 像素 */
    }

    .key {
      /* 每一個按鍵 */
      font-size: 28px;            /* 數字大大的 */
      padding: 0;                 /* 不要內距，用高度控制大小 */
      height: 50px;               /* 高 50 像素，手指還是好按 */
    }

    .key.go {
      /* 「猜！」鍵：用營火橘色，特別顯眼 */
      background-color: #c8661c;  /* 橘咖啡色 */
      font-size: 26px;            /* 字小一點才放得下 */
    }

    .pad.rock {
      /* 鍵盤區的石頭卡片：內距小一點，省空間 */
      padding: 14px;
    }

    #playAgainButton {
      /* 「再玩一次」按鈕：猜中後放在鍵盤下面 */
      width: 100%;                /* 跟鍵盤一樣寬 */
      height: 70px;               /* 高高的，很好按 */
      font-size: 28px;            /* 大字 */
      background-color: #c8661c;  /* 橘色，很顯眼 */
    }

    /* ---------- 橫的螢幕：場景在左、鍵盤在右 ---------- */
    @media (orientation: landscape) and (min-width: 640px) {
      /* 當螢幕是「橫的」而且寬度至少 640 像素時，才套用下面的設定 */

      main {
        max-width: 900px;           /* 內容可以更寬 */
      }

      .board {
        flex-direction: row;        /* 改成左右排 */
        align-items: flex-start;    /* 靠上對齊 */
      }

      .camp {
        flex: 1.25;                 /* 場景比鍵盤寬一點 */
      }

      .sceneWrap {
        width: fit-content;         /* 外框縮到跟場景一樣寬，牌子才會剛好在場景上 */
        max-width: 100%;            /* 但不能超過這一欄 */
        margin: 0 auto;             /* 置中 */
      }

      .scene {
        width: auto;                /* 寬度照比例自動算 */
        max-width: 100%;            /* 不能超過這一欄 */
        height: 440px;              /* 舊瀏覽器用 */
        height: min(calc(100dvh - 60px), 440px);  /* 橫的時候用「高度」決定大小：幾乎整個螢幕高，最多 440 */
        max-height: none;           /* 拿掉直式用的高度限制 */
        min-height: 0;              /* 拿掉直式用的最小高度 */
      }

      .levels {
        display: grid;                                          /* 難度按鈕改成格子 */
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));  /* 一排放好幾個 */
      }
    }

    @media (max-height: 500px) {
      /* 螢幕很矮的時候（例如手機橫拿），把東西縮小一點 */

      body { padding: 6px 16px; }                  /* 上下少留一點空 */
      h1 { font-size: 26px; margin: 0 0 6px; }     /* 標題變小 */
      .rock { padding: 12px 14px; }                /* 卡片內部空間變小 */
      .board { margin-top: 4px; }                  /* 少留一點空 */
      #muteButton { font-size: 14px; padding: 2px 10px; }  /* 音效開關變小 */
      .scene { height: calc(100vh - 48px); height: calc(100dvh - 48px); }
      /* 場景幾乎用掉整個螢幕高度 */
      .sign { width: 92%; padding: 4px 8px; top: 6px; }  /* 牌子寬一點、內距小一點 */
      .pad.rock { padding: 10px; }                 /* 鍵盤區內距更小 */
      .screenRow { margin-bottom: 6px; gap: 6px; } /* 石板那一排變緊 */
      #display { font-size: 26px; min-height: 38px; line-height: 32px; }  /* 數字石板變小 */
      #peekButton { font-size: 13px; }             /* 偷看按鈕字變小 */
      .keys { gap: 6px; }                          /* 按鍵間隔變小 */
      .key { height: 38px; font-size: 22px; box-shadow: 0 3px 0 var(--wood-dark); }  /* 按鍵變矮 */
      .key.go { font-size: 20px; }                 /* 猜！小一點 */
    }
    /* ===== CSS 結束 ===== */
  </style>
</head>

  <script>

    function setCount(text) {
      // 更新「猜了幾次」那一行
      countLine = text;
      // 記住平常要顯示的字
      if (peeking === false) {
        // 如果沒有在偷看

      }
    }
    let muteButton = document.getElementById("muteButton");
    // 音效開關

    // ---------- 3. 音效（用程式即時做出聲音） ----------
    function getAudio() {
      // 拿到聲音引擎；還沒有就建立一個
      if (audio === null) {
        // 如果還沒建立過
        try {
          // try：試試看，失敗也不要讓整個遊戲壞掉
          audio = new AudioContext();
          // 建立聲音引擎
        } catch (error) {
          // 如果這台裝置不支援
          audio = null;
          // 就當作沒有聲音
        }
      }
      if (audio !== null && audio.state === "suspended") {
        // 有些瀏覽器一開始會把聲音「暫停」
        audio.resume();
        // 叫它繼續
      }
      return audio;
      // 把聲音引擎交出去
    }

    function playTone(frequency, seconds, volume) {
      // 發出一個「嗶」的音；frequency 是音高，seconds 是幾秒，volume 是音量
      if (muted) return;
      // 靜音的話就什麼都不做
      let ctx = getAudio();
      // 拿到聲音引擎
      if (ctx === null) return;
      // 沒有聲音引擎就算了
      let oscillator = ctx.createOscillator();
      // oscillator（振盪器）會產生固定音高的聲音
      let gain = ctx.createGain();
      // gain 是音量控制器
      oscillator.frequency.value = frequency;
      // 設定音高
      gain.gain.setValueAtTime(volume, ctx.currentTime);
      // 一開始的音量
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + seconds);
      // 在 seconds 秒內慢慢變小聲
      oscillator.connect(gain);
      // 振盪器 → 音量控制器
      gain.connect(ctx.destination);
      // 音量控制器 → 喇叭
      oscillator.start();
      // 開始發聲
      oscillator.stop(ctx.currentTime + seconds);
      // seconds 秒後停止
    }

    function playNoise(seconds, volume, brightness) {
      // 發出「沙沙」的雜音；brightness 越大越尖（像「嚓」），越小越悶（像「轟」）
      if (muted) return;
      // 靜音就不做
      let ctx = getAudio();
      // 拿到聲音引擎
      if (ctx === null) return;
      // 沒有就算了
      let length = Math.floor(ctx.sampleRate * seconds);
      // 算出這段聲音需要幾個「點」
      let buffer = ctx.createBuffer(1, length, ctx.sampleRate);
      // 準備一段空白的聲音
      let data = buffer.getChannelData(0);
      // 拿到這段聲音的每一個點
      for (let i = 0; i < length; i = i + 1) {
        // 每一個點都……
        data[i] = Math.random() * 2 - 1;
        // ……填一個 -1 到 1 的隨機數字，就變成沙沙的雜音
      }
      let source = ctx.createBufferSource();
      // 建立一個播放器
      source.buffer = buffer;
      // 把雜音放進播放器
      let filter = ctx.createBiquadFilter();
      // 濾波器：可以把聲音變尖或變悶
      filter.type = "lowpass";
      // lowpass 表示只讓「低音」通過
      filter.frequency.value = brightness;
      // 低於多少的聲音可以通過
      let gain = ctx.createGain();
      // 音量控制器
      gain.gain.setValueAtTime(volume, ctx.currentTime);
      // 一開始的音量
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + seconds);
      // 慢慢變小聲
      source.connect(filter);
      // 播放器 → 濾波器
      filter.connect(gain);
      // 濾波器 → 音量控制器
      gain.connect(ctx.destination);
      // 音量控制器 → 喇叭
      source.start();
      // 開始播放
    }

    function soundKey() {
      // 按鍵聲「嗶」
      playTone(700, 0.06, 0.15);
    }

    function soundStrike() {
      // 刷打火石「嚓」
      playNoise(0.3, 0.5, 7000);
    }

    function soundFizz() {
      // 沒點著、冒煙「噗嘶～」
      playNoise(0.7, 0.25, 800);
    }

    function soundRoar() {
      // 成功生火「轟」
      playNoise(1.4, 0.8, 900);
      // 低沉的大聲雜音
      playTone(110, 1.0, 0.25);
      // 再加一個低音，聽起來更有力
    }

    function toggleMute() {
      // 按下音效開關時執行

    // ---------- 4. 場景動畫的小工具 ----------
    function later(milliseconds, task) {
      // 等 milliseconds 毫秒後做 task，並且把計時器記下來
      let timer = setTimeout(task, milliseconds);
      // setTimeout：等一段時間再做
      timers.push(timer);
      // push：放進 timers 清單
    }

    function cancelTimers() {
      // 取消所有還沒做的計時器
      for (let i = 0; i < timers.length; i = i + 1) {
        // 清單裡的每一個……
        clearTimeout(timers[i]);
        // ……都取消
      }
      timers = [];
      // 清單清空
    }

    function resetScene() {
      // 讓場景回到「還沒點火」的樣子
      cancelTimers();

      document.getElementById("pit1").setAttribute("class", "pit");

      aimStriker("solo");

      sparks.innerHTML = "";
      // 清掉所有火星
      fireText.textContent = "";
      // 清掉「沒點著…」

    function aimStriker(where) {
      // 把打火棒、火星、閃光移到指定的火堆："solo"（一堆火）、0（左邊）、1（右邊）
      let tipX = 201;
      // 尖端的 x 座標（一堆火）
      if (where === "solo") {
        strikerPos.setAttribute("class", "strikerPos solo");
      } else if (where === 0) {
        strikerPos.setAttribute("class", "strikerPos sideL");
        tipX = 111;
        // 左邊火堆的上方
      } else {
        strikerPos.setAttribute("class", "strikerPos sideR");
        tipX = 289;
        // 右邊火堆的上方
      }
      sparks.setAttribute("transform", "translate(" + tipX + " 170)");
      // 火星從尖端噴出
      flashPos.setAttribute("transform", "translate(" + tipX + " 170)");
      // 閃光也在尖端
    }

    function shootSparks(side) {
      // 做出 18 顆火星，放在鎂棒尖端；side 是 1（往左下噴）或 -1（往右下噴）
      for (let i = 0; i < 18; i = i + 1) {
        // 重複 18 次
        let dx = (-50 + Math.random() * 90) * side;
        // 往左右飛多遠（-50 到 40 之間隨機，side 是 -1 時左右相反）
        let dy = 60 + Math.random() * 18;
        // 往下掉多遠（60 到 78 之間隨機）
        let length = Math.sqrt(dx * dx + dy * dy);
        // 飛行距離（畢氏定理）
        let tail = 7 + Math.random() * 6;
        // 尾巴長度
        let line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        // 做出一條 SVG 線段（createElementNS 是做 SVG 用的）
        line.setAttribute("class", "spark");
        // 取名叫 spark，CSS 會讓它飛
        line.setAttribute("x1", 0);
        // 線的頭在 (0, 0)
        line.setAttribute("y1", 0);
        // 線的頭在 (0, 0)
        line.setAttribute("x2", (-dx / length * tail).toFixed(1));
        // 尾巴朝飛行的反方向（toFixed(1) 是只留一位小數）
        line.setAttribute("y2", (-dy / length * tail).toFixed(1));
        // 尾巴朝飛行的反方向
        if (i % 3 === 0) {
          // 每 3 顆有 1 顆
          line.setAttribute("stroke", "#ffffff");
          // 是白色的
        } else {
          // 其他的
          line.setAttribute("stroke", "#ffe066");
          // 是亮黃色的
        }
        line.setAttribute("stroke-width", "2.4");
        // 線的粗細
        line.setAttribute("stroke-linecap", "round");
        // 線的兩端是圓的
        line.style.setProperty("--dx", dx.toFixed(0) + "px");
        // 告訴 CSS 往左右飛多遠
        line.style.setProperty("--dy", dy.toFixed(0) + "px");
        // 告訴 CSS 往下掉多遠
        line.style.setProperty("--hop", (6 + Math.random() * 10).toFixed(0) + "px");
        // 告訴 CSS 彈多高
        line.style.animationDelay = (0.82 + Math.random() * 0.08).toFixed(2) + "s";
        // 0.82 秒後才噴出來（剛好是刮刀刷到尖端的時候）
        sparks.appendChild(line);
        // 放進場景
      }
    }

    // ---------- 5. 開始前的步驟：選模式 → 選動物 → 選難度 → 抽籤 ----------
    function showStep(stepId) {
      // 只顯示其中一個步驟，其他藏起來
      let steps = ["stepMode", "stepPlay", "stepAnimal", "stepLevel", "stepSet", "stepDraw"];
      // 所有步驟的名字
      for (let i = 0; i < steps.length; i = i + 1) {
        // 每一個步驟……
        document.getElementById(steps[i]).hidden = (steps[i] !== stepId);
        // ……如果不是要顯示的那個，就藏起來（!== 是「不等於」）
      }
    }

    function chooseMode(pickedMode) {
      // 按下「單人」或「雙人」時執行
      mode = pickedMode;
      // 記住選了哪個模式
      soundKey();
      // 響一聲
      if (mode === "single") {
        // 單人
        pickPlace();
        // 抽這一局的營地
        showStep("stepLevel");
        // 直接去選難度
      } else {
        // 雙人：先選玩法
        showStep("stepPlay");
      }
    }

    function choosePlay(pickedPlay) {
      // 按下「一起猜」或「互相出題」時執行
      play = pickedPlay;
      // 記住選了哪種玩法
      soundKey();
      // 響一聲
      {
        players = [];
        // 清空之前選的動物
        for (let i = 0; i < 4; i = i + 1) {
          // 四個動物按鈕……
          let button = document.getElementById("animal" + i);
          // 找到第 i 個按鈕
          button.disabled = false;
          // 恢復成可以按
          button.querySelector("small").textContent = "";
          // 清掉「玩家 1」的小字
        }
        document.getElementById("animalTitle").textContent = "玩家 1 選一隻動物";
        // 說明換成玩家 1
        showStep("stepAnimal");
        // 去選動物
      }
    }

    function pickAnimal(index) {
      // 按下某隻動物時執行；index 是動物的編號（0～3）
      players.push(index);
      // 把這隻動物放進玩家清單
      let button = document.getElementById("animal" + index);
      // 找到這隻動物的按鈕
      button.disabled = true;
      // 選走了，別人不能再選
      button.querySelector("small").textContent = "玩家 " + players.length;
      // 下面寫上是哪位玩家選的
      soundKey();
      // 響一聲
      if (players.length === 1) {
        // 如果才選了一隻（玩家 1 選完）
        document.getElementById("animalTitle").textContent = "玩家 2 選一隻動物";
        // 換玩家 2 選
      } else {
        // 兩隻都選好了
        later(300, function () {
          // 等 0.3 秒，讓玩家看到自己選的
          pickPlace();
          // 抽這一局的營地
          showStep("stepLevel");
          // 去選難度
        });
      }
    }

    function pickPlace() {
      // 抽一個營地：不會跟上一局一樣
      let next = Math.floor(Math.random() * 3);
      // 先隨便抽一個（0、1、2）
      if (currentPlace !== -1) {
        // 如果上一局已經有營地了
        next = Math.floor(Math.random() * 2);
        // 從「另外兩個」裡面抽（先抽 0 或 1）
        if (next >= currentPlace) {
          next = next + 1;
          // 碰到上一局的編號就往後跳一個，這樣就不會抽到一樣的
        }
      }
      currentPlace = next;
      // 記住這一局的營地
      for (let i = 0; i < 3; i = i + 1) {
        // 三個營地的背景……
        if (i === next) {
          document.getElementById("place" + i).setAttribute("display", "inline");
          // 抽中的顯示出來
        } else {
          document.getElementById("place" + i).setAttribute("display", "none");
          // 其他的藏起來
        }
      }
      document.getElementById("placeName").textContent = PLACE_NAMES[next];
      // 選難度畫面上寫出營地名字
    }

    function chooseLevel(min, max) {
      // 按下難度按鈕時執行
      minNumber = min;
      // 先記住範圍（出題時要用）
      maxNumber = max;
      maxDigits = String(max).length;
      // 最多能打幾位數
      pendingMin = min;
      pendingMax = max;
      if (mode === "single") {
        // 單人：直接開始
        startGame(min, max);
      } else if (play === "shared") {
        // 雙人一起猜：先抽籤
        drawLots(min, max);
      } else {
        // 互相出題：玩家 1 先出題
        setter = 0;
        startSetting();
      }
    }

    // ---------- 5.5 互相出題：蓋住畫面 → 打數字 → 選提示 ----------
    function showSetPart(partId) {
      // 出題的三個小畫面，一次只顯示一個
      let parts = ["setCover", "setEnter", "setHint"];
      for (let i = 0; i < parts.length; i = i + 1) {
        document.getElementById(parts[i]).hidden = (parts[i] !== partId);
      }
    }

    function startSetting() {
      // 開始讓某位玩家出題：先蓋住畫面
      let me = ANIMALS[players[setter]];
      // 出題的動物
      let them = ANIMALS[players[1 - setter]];
      // 另一位（要轉過頭的）
      document.getElementById("coverFace").innerHTML = bigFace(me);
      // 大大的動物
      document.getElementById("coverText").innerHTML = me.name + "要出題了！<br>" + face(them) + them.name + "請轉過頭，不要偷看 👀";
      // 說明（innerHTML 可以放 <br> 換行）
      document.body.classList.add("playing");
      // 藏起大標題，讓畫面放得下
      showStep("stepSet");
      // 顯示出題步驟
      showSetPart("setCover");
      // 先顯示蓋住的畫面
    }

    function setReady() {
      // 出題的人按「我準備好了」
      let me = ANIMALS[players[setter]];
      let them = ANIMALS[players[1 - setter]];
      setTyped = "";
      // 清空
      document.getElementById("setErr").textContent = "";
      // 清空提醒
      document.getElementById("setTitle").innerHTML = face(me) + me.name + "出一個 " + minNumber + "～" + maxNumber + " 的數字給" + them.name + "猜";
      // 說明
      drawSetDisplay();
      // 更新石板
      soundKey();
      showSetPart("setEnter");
      // 顯示打數字的畫面
    }

    function drawSetDisplay() {
      // 把出題的數字畫在石板上：平常只顯示 ●，按住「看一下」才顯示數字
      if (setTyped === "") {
        setDisplay.textContent = "?";
        setDisplay.classList.add("empty");
      } else {
        setDisplay.classList.remove("empty");
        if (setPeeking) {
          setDisplay.textContent = setTyped;
          // 按著「看一下」：顯示真正的數字
        } else {
          setDisplay.textContent = "●".repeat(setTyped.length);
          // repeat：● 重複「位數」那麼多次
        }
      }
    }

    function setDigit(digit) {
      // 出題時按數字
      if (setTyped.length >= maxDigits) return;
      // 打滿位數就不能再打
      if (setTyped === "" && digit === 0) return;
      // 第一個數字不能是 0
      setTyped = setTyped + digit;
      document.getElementById("setErr").textContent = "";
      soundKey();
      drawSetDisplay();
    }

    function setDelete() {
      // 出題時按 ⌫
      setTyped = setTyped.slice(0, -1);
      soundKey();
      drawSetDisplay();
    }

    function makeHints(n) {
      // 依照出的數字，做出「一定是對的」提示清單
      let list = [];
      // 空清單
      if (n % 2 === 1) {
        list.push("是單數");
        // 除以 2 餘 1 → 單數
      } else {
        list.push("是雙數");
      }
      list.push("個位數是 " + (n % 10));
      // n % 10 是除以 10 的餘數，就是個位數
      let middle = Math.floor((minNumber + maxNumber) / 2);
      // 範圍的中間數（例如 1～100 是 50）
      if (n < middle) {
        list.push("比 " + middle + " 小");
      } else if (n > middle) {
        list.push("比 " + middle + " 大");
      }
      // 剛好等於中間數就不給這個提示
      return list;
    }

    function setDone() {
      // 出題的人按「出好了」
      let errBox = document.getElementById("setErr");
      if (setTyped === "") {
        errBox.textContent = "先打一個數字喔！";
        return;
      }
      let n = Number(setTyped);
      if (n < minNumber || n > maxNumber) {
        errBox.textContent = "要在 " + minNumber + "～" + maxNumber + " 之間喔！";
        return;
      }
      secrets[setter] = n;
      // 記住這位玩家出的數字
      let them = ANIMALS[players[1 - setter]];
      document.getElementById("hintTitle").innerHTML = "選一個提示給 " + face(them) + them.name;
      // 說明
      let box = document.getElementById("hintButtons");
      box.innerHTML = "";
      // 清空之前的提示按鈕
      let list = makeHints(n);
      list.push("");
      // 最後加一個「不給提示」（用 "" 代表）
      for (let i = 0; i < list.length; i = i + 1) {
        let button = document.createElement("button");
        // 做一個新按鈕
        button.className = "wood";
        if (list[i] === "") {
          button.textContent = "不給提示";
        } else {
          button.textContent = "💡 " + list[i];
        }
        let hint = list[i];
        // 把這個提示記在 hint 裡，按下去時才拿得到
        button.addEventListener("click", function () {
          pickHint(hint);
        });
        box.appendChild(button);
        // 放進畫面
      }
      soundKey();
      showSetPart("setHint");
    }

    function pickHint(hint) {
      // 選好提示
      hintsGiven[setter] = hint;
      soundKey();
      if (setter === 0) {
        // 玩家 1 出完了 → 換玩家 2 出題
        setter = 1;
        startSetting();
      } else {
        // 兩個人都出好了 → 抽籤
        drawLots(pendingMin, pendingMax);
      }
    }

    function drawLots(min, max) {
      // 抽籤：兩張卡片輪流亮，越來越慢，最後停在先猜的人
      showStep("stepDraw");
      // 顯示抽籤畫面
      for (let i = 0; i < 2; i = i + 1) {
        // 兩張卡片……
        let animal = ANIMALS[players[i]];
        // 這位玩家的動物資料
        document.getElementById("drawFace" + i).innerHTML = bigFace(animal);
        // 放上表情符號
        document.getElementById("drawName" + i).textContent = "玩家 " + (i + 1) + "\n" + animal.name;
        // 放上名字（\n 是換行：上面「玩家 1」、下面動物名字）
        document.getElementById("drawCard" + i).style.setProperty("--a", animal.color);
        // 卡片用動物的顏色
        document.getElementById("drawCard" + i).classList.remove("on");
        // 先都不亮
      }
      document.getElementById("drawText").textContent = "";
      // 清空結果文字

      let winner = Math.floor(Math.random() * 2);
      // 先偷偷抽好誰先猜（0 或 1）
      let lit = 0;
      // 現在亮的是哪一張
      let delay = 70;
      // 每次換卡片要等多久（毫秒），會越來越久

      function flashNext() {
        // 亮下一張卡片（「函式裡面的函式」，只給抽籤用）
        document.getElementById("drawCard0").classList.toggle("on", lit === 0);
        // 卡片 0：如果 lit 是 0 就亮，不是就暗
        document.getElementById("drawCard1").classList.toggle("on", lit === 1);
        // 卡片 1：如果 lit 是 1 就亮，不是就暗
        playTone(880, 0.05, 0.12);
        // 「嗶」
        if (delay > 380 && lit === winner) {
          // 已經夠慢了，而且剛好停在抽中的人 → 結束
          let animal = ANIMALS[players[winner]];
          // 抽中的動物
          document.getElementById("drawText").innerHTML = face(animal) + animal.name + "先猜！";
          // 顯示誰先猜
          playTone(1320, 0.4, 0.2);
          // 「叮！」
          turn = winner;
          // 記住輪到誰
          setTimeout(function () {
            // 等 1.4 秒讓大家看清楚
            startGame(min, max);
            // 開始遊戲
          }, 1400);
          return;
          // 結束，不再閃
        }
        lit = 1 - lit;
        // 換另一張（1 - 0 = 1，1 - 1 = 0）
        delay = delay * 1.18;
        // 下一次等久一點 → 越閃越慢
        setTimeout(flashNext, delay);
        // 等 delay 毫秒後再閃下一張
      }

      flashNext();
      // 開始閃
    }

    function updateTurnLine() {
      // 更新牌子最上面那一行
      if (mode === "single") {
        // 單人
        infoText.textContent = "電腦想了一個 " + minNumber + "～" + maxNumber + " 的數字";
        // 顯示範圍說明
        infoText.style.color = "";
        // 用原本的顏色
        infoText.classList.remove("turn");
        // 用一般大小的字
      } else {
        // 雙人
        infoText.classList.add("turn");
        // 用比較大的字
        let animal = ANIMALS[players[turn]];
        // 現在輪到的動物
        if (play === "mutual") {
          infoText.innerHTML = "輪到 " + face(animal) + animal.name;
          // 互相出題：只顯示輪到誰
          let hint = hintsGiven[1 - turn];
          // 要猜的題目是另一個人出的，提示也是他給的
          if (hint === "") {
            hintText.textContent = "💡 沒有提示";
          } else {
            hintText.textContent = "💡 提示：" + hint;
          }
        } else {
          infoText.innerHTML = "輪到 " + face(animal) + animal.name + "　（" + minNumber + "～" + maxNumber + "）";
          // 一起猜：顯示「輪到誰」和範圍
        }
        infoText.style.color = animal.color;
        // 用那隻動物的顏色
      }
    }

    function countWords(times) {
      // 「猜了幾次」那行要怎麼寫
      if (mode === "double" && play === "mutual") {
        return "";
        // 互相出題：次數顯示在火堆旁邊，牌子上不重複
      }
      if (mode === "double") {
        // 雙人
        return "兩人一共猜了 " + times + " 次";
      }
      return "已經猜了 " + times + " 次";
      // 單人
    }

    // ---------- 6. 開始遊戲（選好難度、抽完籤之後執行） ----------
    function startGame(min, max) {
      // min 和 max 是難度按鈕傳進來的數字，例如 1 和 20

      minNumber = min;
      // 記住最小數字
      maxNumber = max;
      // 記住最大數字
      maxDigits = String(max).length;
      // 最大數字有幾位，就最多能打幾位

      answer = Math.floor(Math.random() * (max - min + 1)) + min;
      // 在 min～max 之間選一個秘密數字

      low = min;
      // 答案可能的最小值
      high = max;
      // 答案可能的最大值
      guessCount = 0;
      // 次數歸零
      typed = "";
      // 清空打的數字
      busy = false;
      // 沒有動畫在播
      gameOver = false;
      // 遊戲還沒結束

      hintText.hidden = true;
      // 先藏起提示那一行
      updateTurnLine();
      // 更新牌子最上面一行（單人：範圍；雙人：輪到誰）
      message.textContent = "猜一個數字，刷打火石生火！";
      // 開場提示
      message.style.color = "";
      // 拿掉之前的動物顏色
      message.className = "";
      // 拿掉顏色
      endPeek();
      // 結束偷看
      setCount(countWords(0));
      // 次數顯示歸零
      peekButton.hidden = false;
      // 顯示偷看按鈕
      playAgainButton.hidden = true;
      // 藏起「再玩一次」
      keys.hidden = false;
      // 顯示數字鍵盤
      resetScene();
      // 營火場景回到還沒點火
      updateDisplay();
      // 更新數字石板

      if (mode === "double" && play === "mutual") {
        // 互相出題：換成兩堆火
        scene.classList.add("duo");
        // 加上 duo → 顯示兩堆火的場景
        counts = [0, 0];
        litPits = [false, false];
        lows = [min, min];
        highs = [max, max];
        // 兩個人的次數、火、範圍都歸零
        for (let i = 0; i < 2; i = i + 1) {
          let animal = ANIMALS[players[i]];
          document.getElementById("badge" + i).setAttribute("fill", animal.tint);
          // 圓章底色換成淡色
          document.getElementById("badge" + i).setAttribute("stroke", animal.color);
          // 圓章外框換成動物的顏色
          document.getElementById("badgeFace" + i).setAttribute("href", "#i-" + animal.key);
          // 圓章上放這隻動物的臉
          document.getElementById("countLabel" + i).textContent = "0 次";
          // 次數歸零
        }
        hintText.hidden = false;
        // 顯示提示那一行
        setDuoTurn(turn);
        // 輪到抽籤抽中的人，打火棒移過去
      }

      startScreen.hidden = true;
      // 藏起選難度畫面
      gameScreen.hidden = false;
      // 顯示猜數字畫面
      document.body.classList.add("playing");
      // body 加上 playing → 藏起大標題，省下空間
    }

    // ---------- 7. 數字鍵盤 ----------
    function updateDisplay() {
      // 把打的數字顯示在石板上
      if (typed === "") {
        // 如果還沒打
        display.textContent = "?";
        // 顯示問號
        display.classList.add("empty");
        // 讓問號變淡
      } else {
        // 如果有打
        display.textContent = typed;
        // 顯示打的數字
        display.classList.remove("empty");
        // 拿掉淡淡的效果
      }
    }

    function pressDigit(digit) {
      // 按下數字鍵時執行；digit 是按的數字
      if (busy || gameOver) return;
      // 刷打火石中或遊戲結束了，就不理它（|| 是「或」）
      if (typed.length >= maxDigits) return;
      // 已經打滿位數了，不能再打
      if (typed === "" && digit === 0) return;
      // 第一個數字不能是 0
      typed = typed + digit;
      // 把新的數字接在後面（例如 "4" + 7 = "47"）
      soundKey();
      // 響一聲
      updateDisplay();
      // 更新石板
    }

    function deleteDigit() {
      // 按下 ⌫ 時執行
      if (busy || gameOver) return;
      // 刷打火石中或遊戲結束就不理它
      typed = typed.slice(0, -1);
      // slice(0, -1) 是「拿掉最後一個字」
      soundKey();
      // 響一聲
      updateDisplay();
      // 更新石板
    }

    // ---------- 8. 猜！刷打火石 ----------
    function checkGuess() {
      // 按下「猜！」時執行
      if (busy || gameOver) return;
      // 刷打火石中或遊戲結束就不理它

      if (typed === "") {
        // 如果還沒打數字
        message.textContent = "先按數字喔！";
        // 提醒玩家
        message.className = "";
        // 不加顏色
        return;
        // return 表示「到這裡就結束，下面不做了」
      }

      let guess = Number(typed);
      // 把打的文字變成數字

      if (guess < minNumber || guess > maxNumber) {
        // 如果超出範圍
        message.textContent = "要在 " + minNumber + "～" + maxNumber + " 之間喔！";
        // 提醒範圍
        message.className = "";
        // 不加顏色
        return;
        // 結束，不算一次
      }

      busy = true;
      // 開始刷打火石，先鎖住按鍵
      guessCount = guessCount + 1;
      // 次數加 1
      setCount(countWords(guessCount));
      // 更新次數
      message.textContent = "刷——";
      // 顯示刷打火石的聲音
      message.className = "";
      // 不加顏色
      message.style.color = "";
      // 拿掉「換人」時用的動物顏色

      let side = 1;
      // 火星往左下噴
      if (mode === "double" && play === "mutual") {
        // 互相出題：不能整個重來（另一堆火可能已經點著了）
        counts[turn] = counts[turn] + 1;
        // 這位玩家的次數加 1
        document.getElementById("countLabel" + turn).textContent = counts[turn] + " 次";
        // 更新火堆旁的次數
        if (litPits[turn] === false) {
          document.getElementById("pit" + turn).setAttribute("class", "pit");
          // 這堆火的白煙清掉
        }
        scene.classList.remove("strike");
        // 先拿掉 strike
        sparks.innerHTML = "";
        // 清掉火星
        fireText.textContent = "";
        // 清掉「沒點著」
        if (turn === 1) {
          side = -1;
          // 右邊的火：火星往右下噴
        }
      } else {
        resetScene();
        // 先把上一次的白煙、火星清掉
      }
      scene.getBoundingClientRect();
      // 讓瀏覽器「重新看一次」場景，下一行加上 strike 時動畫才會從頭播
      scene.classList.add("strike");
      // 加上 strike → 刮刀刷過去、尖端閃光
      shootSparks(side);
      // 做出火星（0.82 秒後才噴出來）

      later(820, function () {
        // 0.82 秒後：刮刀刷到尖端
        message.textContent = "唷！";
        // 顯示「唷！」
        soundStrike();
        // 「嚓」
      });

      later(1750, function () {
        // 1.75 秒後：火星落到木柴上了
        if (mode === "double" && play === "mutual") {
          showDuoResult(guess);
          // 互相出題的結果
        } else {
          showResult(guess);
          // 揭曉結果
        }
      });
    }

    function showResult(guess) {
      // 火星落到木柴以後，決定點著沒有
      scene.classList.remove("strike");
      // 拿掉 strike
      sparks.innerHTML = "";
      // 清掉火星
      scene.classList.add("ember-on");
      // 木柴閃一下紅點

      if (guess === answer) {
        // 猜對了！
        gameOver = true;
        // 這局結束，不能再按數字
        message.textContent = "木柴發紅了……";
        // 先賣個關子

        later(650, function () {
          // 0.65 秒後
          scene.classList.remove("ember-on");
          // 拿掉 ember-on
          scene.classList.add("lit");
          // 加上 lit → 火「呼、呼」地長大、照亮場景
          soundRoar();
          // 「轟」
          message.className = "win";
          // 金黃色
          endPeek();
          // 結束偷看
          if (mode === "single") {
            // 單人
            message.textContent = "生火成功！答案是 " + answer + "！";
            // 顯示答對
            setCount("你猜了 " + guessCount + " 次就答對了！");
            // 告訴玩家總共猜幾次
          } else {
            // 雙人
            let animal = ANIMALS[players[turn]];
            // 猜中的動物
            message.innerHTML = face(animal) + animal.name + "生火成功！答案是 " + answer + "！";
            // 顯示誰猜中
            setCount(animal.name + "贏了！兩人一共猜了 " + guessCount + " 次");
            // 誰贏了、一共猜了幾次
            infoText.textContent = "電腦想了一個 " + minNumber + "～" + maxNumber + " 的數字";
            // 最上面那行換回範圍說明
            infoText.style.color = "";
            // 用原本的顏色
            infoText.classList.remove("turn");
            // 用一般大小的字
          }
          peekButton.hidden = true;
          // 藏起偷看按鈕
          keys.hidden = true;
          // 藏起數字鍵盤（已經猜中了，用不到）
          playAgainButton.hidden = false;
          // 在鍵盤的位置顯示「再玩一次」
          busy = false;
          // 解鎖
        });
        return;
        // 結束
      }

      // 走到這裡表示猜錯了
      if (guess > answer) {
        // 猜太大
        message.textContent = guess + " 太大了！";
        // 顯示太大了
        message.className = "big";
        // 紅橘色
        if (guess - 1 < high) {
          // 如果範圍可以縮小
          high = guess - 1;
          // 答案最大只可能是 guess - 1
        }
      } else {
        // 猜太小
        message.textContent = guess + " 太小了！";
        // 顯示太小了
        message.className = "small";
        // 淺藍色
        if (guess + 1 > low) {
          // 如果範圍可以縮小
          low = guess + 1;
          // 答案最小只可能是 guess + 1
        }
      }

      typed = "";
      // 清空打的數字
      updateDisplay();
      // 更新石板
      if (mode === "single") {
        // 單人
        busy = false;
        // 解鎖：冒煙的時候就可以打下一個數字
      } else {
        // 雙人：等煙冒一下，再換人
        later(1100, function () {
          // 1.1 秒後
          turn = 1 - turn;
          // 換另一位玩家
          updateTurnLine();
          // 牌子換成「輪到 下一位」
          infoText.classList.remove("flash");
          // 先拿掉 flash……
          infoText.getBoundingClientRect();
          // ……讓瀏覽器重新看一次……
          infoText.classList.add("flash");
          // ……再加上 flash，跳一下的動畫才會重新播
          playTone(660, 0.08, 0.12);
          // 「叮」提醒換人
          busy = false;
          // 解鎖，換下一位猜
        });
      }

      later(400, function () {
        // 0.4 秒後
        scene.classList.add("smoke");
        // 加上 smoke → 冒白煙
        fireText.textContent = "沒點著…";
        // 顯示「沒點著…」
        soundFizz();
        // 「噗嘶～」
      });

      later(2900, function () {
        // 煙飄完以後
        scene.classList.remove("ember-on", "smoke");
        // 拿掉冒煙的樣子
        fireText.textContent = "";
        // 清掉「沒點著…」
      });
    }

    // ---------- 8.5 互相出題：兩堆火的輪流和結果 ----------
    function setDuoTurn(i) {
      // 換成第 i 位玩家猜
      turn = i;
      aimStriker(i);
      // 打火棒滑到這位玩家的火堆
      for (let k = 0; k < 2; k = k + 1) {
        document.getElementById("badge" + k).classList.toggle("active", k === i);
        // 輪到的人圓章白框變粗
      }
      updateTurnLine();
      // 牌子換成「輪到 某某」和他的提示
    }

    function showDuoResult(guess) {
      // 互相出題：火星落下以後，看看有沒有點著
      let me = turn;
      // 現在猜的人
      let other = 1 - me;
      // 另一位
      let pit = document.getElementById("pit" + me);
      // 這位玩家的火堆
      let target = secrets[other];
      // 要猜的數字是另一位出的
      let meAnimal = ANIMALS[players[me]];
      let otherAnimal = ANIMALS[players[other]];
      scene.classList.remove("strike");
      sparks.innerHTML = "";
      pit.setAttribute("class", "pit ember-on");
      // 木柴閃一下紅點

      if (guess === target) {
        // 猜中了
        litPits[me] = true;
        message.textContent = "木柴發紅了……";
        typed = "";
        // 清空打的數字，下一位才能從頭打
        updateDisplay();
        // 更新石板
        later(650, function () {
          pit.setAttribute("class", "pit lit");
          // 這堆火點起來
          if (me === 0) {
            scene.classList.add("litL");
            // 告訴場景「左邊的火點著了」（湖邊營地的湖面會映出火光）
          } else {
            scene.classList.add("litR");
            // 右邊的火點著了
          }
          soundRoar();
          message.innerHTML = face(meAnimal) + meAnimal.name + "生火成功！";
          message.className = "win";
          if (litPits[other]) {
            // 兩堆火都點著了 → 結束
            finishMutual();
            return;
          }
          setCount(face(meAnimal) + meAnimal.name + "用了 " + counts[me] + " 次，" + face(otherAnimal) + otherAnimal.name + "加油！");
          // 幫另一位加油
          later(1300, function () {
            setDuoTurn(other);
            // 換另一位繼續猜
            sayNextTurn();
            // 牌子顯示「換 某某 猜囉！」
            busy = false;
          });
        });
        return;
      }

      // 猜錯了
      if (guess > target) {
        message.textContent = guess + " 太大了！";
        message.className = "big";
        if (guess - 1 < highs[me]) {
          highs[me] = guess - 1;
          // 這位玩家那一題的範圍縮小
        }
      } else {
        message.textContent = guess + " 太小了！";
        message.className = "small";
        if (guess + 1 > lows[me]) {
          lows[me] = guess + 1;
        }
      }
      typed = "";
      updateDisplay();

      later(400, function () {
        pit.setAttribute("class", "pit ember-on smoke");
        // 這堆火冒白煙
        fireText.setAttribute("x", me === 0 ? 110 : 290);
        fireText.setAttribute("y", 205);
        // 「沒點著…」放在這堆火上方
        fireText.textContent = "沒點著…";
        soundFizz();
      });

      later(1100, function () {
        if (litPits[other] === false) {
          // 另一位還沒點著 → 換他猜
          setDuoTurn(other);
          sayNextTurn();
          // 清掉上一位的「太大了／太小了」，換成「換 某某 猜囉！」
          infoText.classList.remove("flash");
          infoText.getBoundingClientRect();
          infoText.classList.add("flash");
          // 「輪到誰」跳一下
          playTone(660, 0.08, 0.12);
        }
        // 另一位已經點著了 → 不換人，繼續猜
        busy = false;
      });

      later(2900, function () {
        if (litPits[me] === false) {
          pit.setAttribute("class", "pit");
          // 白煙飄完，恢復原狀
        }
        fireText.textContent = "";
      });
    }

    function sayNextTurn() {
      // 換人的時候，牌子上的結果那行改成「換 某某 猜囉！」（用那隻動物的顏色）
      let animal = ANIMALS[players[turn]];
      // 現在輪到的動物
      message.innerHTML = "換 " + face(animal) + animal.name + "猜囉！";
      message.className = "";
      // 拿掉紅橘、淺藍等顏色
      message.style.color = animal.color;
      // 改用動物的顏色
    }

    function finishMutual() {
      // 兩堆火都點著了：公布結果
      gameOver = true;
      strikerPos.classList.add("gone");
      // 打火棒收起來
      for (let k = 0; k < 2; k = k + 1) {
        document.getElementById("badge" + k).classList.remove("active");
      }
      let a0 = ANIMALS[players[0]];
      let a1 = ANIMALS[players[1]];
      infoText.innerHTML = "答案：" + face(a0) + "出 " + secrets[0] + "　" + face(a1) + "出 " + secrets[1];
      // 公布兩題的答案（誰出的題目）
      infoText.style.color = "";
      hintText.hidden = true;
      // 藏起提示
      if (counts[0] === counts[1]) {
        message.textContent = "平手！兩個人都用 " + counts[0] + " 次";
      } else if (counts[0] < counts[1]) {
        message.innerHTML = face(a0) + a0.name + "贏了！";
        // 次數少的贏
      } else {
        message.innerHTML = face(a1) + a1.name + "贏了！";
      }
      message.className = "win";
      endPeek();
      setCount("兩堆營火都點起來了 🎉");
      peekButton.hidden = true;
      keys.hidden = true;
      playAgainButton.hidden = false;
      busy = false;
    }

    // ---------- 9. 偷看範圍（按住顯示；點一下顯示 2 秒） ----------
    function showRange() {
      // 手指或滑鼠按下去時執行
      clearTimeout(peekTimer);
      // 如果之前有「2 秒後藏起來」的計時器，先取消
      pressing = true;
      // 記住：正按著
      peekStart = Date.now();
      // 記住按下去的時間（Date.now() 是現在的時間，單位是毫秒）
      peeking = true;
      // 記住：正在偷看
      let showLow = low;
      // 要顯示的最小值
      let showHigh = high;
      // 要顯示的最大值
      if (mode === "double" && play === "mutual") {
        showLow = lows[turn];
        showHigh = highs[turn];
        // 互相出題：只看得到自己那一題的範圍
      }
      countText.textContent = "答案在 " + showLow + "～" + showHigh + " 之間";
      // 牌子最下面那行換成範圍
      countText.classList.add("peek");
      // 變成金黃色
    }

    function releaseRange() {
      // 手指或滑鼠放開時執行
      if (pressing === false) return;
      // 本來就沒按著，就不理它
      pressing = false;
      // 記住：放開了
      if (Date.now() - peekStart < 300) {
        // 如果按不到 0.3 秒（只是「點一下」）
        peekTimer = setTimeout(endPeek, 2000);
        // 就再顯示 2 秒才藏起來
      } else {
        // 如果是「按住」一段時間
        endPeek();
        // 放開就馬上藏起來
      }
    }

    function endPeek() {
      // 結束偷看，換回「猜了幾次」
      clearTimeout(peekTimer);
      // 取消計時器
      pressing = false;
      // 沒有按著
      peeking = false;
      // 沒有在偷看
      countText.innerHTML = countLine;
      // 換回平常的字
      countText.classList.remove("peek");
      // 拿掉金黃色
    }

    // ---------- 10. 再玩一次：回到最開始 ----------
    function playAgain() {
      // 按下「再玩一次」時執行
      resetScene();
      // 營火熄掉，恢復原狀
      gameScreen.hidden = true;
      // 藏起猜數字畫面
      showStep("stepMode");
      // 回到第一步：選單人或雙人
      startScreen.hidden = false;
      // 顯示開始前的設定畫面
      document.body.classList.remove("playing");
      // 拿掉 playing → 大標題回來
    }

    // ---------- 11. 把按鈕和功能連起來 ----------
    playAgainButton.addEventListener("click", playAgain);
    // 點「再玩一次」→ 回到選難度

    muteButton.addEventListener("click", toggleMute);
    // 點音效開關 → 切換靜音

    peekButton.addEventListener("pointerdown", showRange);
    // pointerdown：手指或滑鼠「按下去」→ 顯示範圍
    peekButton.addEventListener("pointerup", releaseRange);
    // pointerup：「放開」→ 按住的話馬上藏，點一下的話 2 秒後藏
    peekButton.addEventListener("pointerleave", releaseRange);
    // pointerleave：按著滑出按鈕外面 → 當作放開
    peekButton.addEventListener("pointercancel", releaseRange);
    // pointercancel：被系統打斷 → 當作放開
    peekButton.addEventListener("contextmenu", function (event) {
      // 手機長按會跳出選單
      event.preventDefault();
      // 把它擋掉（preventDefault = 不要做原本預設的事）
    });

    setPeekButton.addEventListener("pointerdown", function () {
      // 出題時按住「看一下」→ 顯示數字
      setPeeking = true;
      drawSetDisplay();
    });
    setPeekButton.addEventListener("pointerup", stopSetPeek);
    setPeekButton.addEventListener("pointerleave", stopSetPeek);
    setPeekButton.addEventListener("pointercancel", stopSetPeek);
    setPeekButton.addEventListener("contextmenu", function (event) {
      event.preventDefault();
      // 擋掉長按選單
    });
    function stopSetPeek() {
      // 放開「看一下」→ 又變回 ●
      setPeeking = false;
      drawSetDisplay();
    }

    document.addEventListener("keydown", function (event) {
      // 電腦鍵盤按下任何鍵時執行；event.key 是按了哪個鍵
      if (startScreen.hidden === false && document.getElementById("stepSet").hidden === false && document.getElementById("setEnter").hidden === false) {
        // 正在出題（打數字的畫面）
        if (event.key.length === 1 && event.key >= "0" && event.key <= "9") {
          setDigit(Number(event.key));
        } else if (event.key === "Backspace") {
          setDelete();
        } else if (event.key === "Enter") {
          event.preventDefault();
          setDone();
        }
        return;
      }
      if (gameScreen.hidden) return;
      // 不在猜數字畫面就不理它
      if (event.key.length === 1 && event.key >= "0" && event.key <= "9") {
        // 如果按的是 0～9
        pressDigit(Number(event.key));
        // 當作按了畫面上的數字鍵
      } else if (event.key === "Backspace") {
        // 如果按的是 Backspace
        deleteDigit();
        // 刪掉一個數字
      } else if (event.key === "Enter") {
        // 如果按的是 Enter
        event.preventDefault();
        // 擋掉 Enter 原本的作用（避免同時按到別的按鈕）
        checkGuess();
        // 當作按了「猜！」
      }
    });

    // ===== JavaScript 結束 =====
  </script>
</body>
